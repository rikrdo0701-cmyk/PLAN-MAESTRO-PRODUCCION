name: Validar proyecto

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Run tests (reporting only)
        run: npm test || true
      - run: npm run build
      - name: Verificar frontend generado
        run: |
          test -f site/index.html
          grep -q "PlannerCore" site/index.html
          grep -q "scheduleCurrentPlan" site/index.html
          grep -q "subcontractWindowEnd" site/index.html
          grep -q "syncReleaseRealBtn" site/index.html
