name: Desplegar frontend en GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "src/web/**"
      - "tests/**"
      - "scripts/build-appscript.mjs"
      - "scripts/check-project.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      # El lector de Supabase del frontend (src/web/shared/supabase-reader.js) sale
      # del build con estos dos marcadores VACIOS si no estan, y isConfigured() da
      # falso, o sea que readCatalogs() no se puede ni intentar. MEDIDO 2026-09-29:
      # en el bundle servido de Pages DEFAULT_URL y DEFAULT_ANON_KEY venian vacios y
      # el modulo no tenia a quien llamarlo, que ademas es el otro problema.
      #
      # Son VARIABLES de repositorio, no secretos, y a proposito: la clave
      # publicable viaja dentro del bundle publico de todos modos, que es lo que
      # permite que la pagina lea por PostgREST sin login. La service role key no
      # esta aqui y no debe estar nunca: vive en CONFIG.js, dentro del proyecto de
      # Apps Script.
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
      - name: Verificar frontend generado
        run: |
          test -f site/index.html
          grep -q "PlannerCore" site/index.html
          grep -q "scheduleCurrentPlan" site/index.html
          grep -q "subcontractWindowEnd" site/index.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5
