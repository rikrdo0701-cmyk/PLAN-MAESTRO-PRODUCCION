name: Desplegar frontend en GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "src/web/**"
      - "tests/**"
      - "scripts/build-appscript.mjs"
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Run tests (reporting only)
        run: npm test || true
      - run: npm run build
      - name: Verificar frontend generado
        run: |
          test -f site/index.html
          grep -q "PlannerCore" site/index.html
          grep -q "scheduleCurrentPlan" site/index.html
          grep -q "subcontractWindowEnd" site/index.html
      - name: Validar sincronización de Liberación Real
        run: |
          grep -q "syncReleaseRealBtn" site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
