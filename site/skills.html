  async function guardarInspectionRoute(fila, opciones) {
    const opts = opciones || {};
    const t0 = Date.now();
    const informe = { ok: true, tablas: {}, ms: 0, avisos: [], camino: "inspection_routes", fila: null };
    if (!isConfigured()) {
      return sinEscribir(informe, t0, "Supabase no esta configurado en este build: faltan la URL o la clave publicable");
    }
    const auth = root.PPSupabaseAuth;
    if (!auth || typeof auth.token !== "function") {
      return sinEscribir(informe, t0, "no esta PPSupabaseAuth: no hay quien pida el token de sesion");
    }
    const token = await auth.token();
    if (!token) {
      return sinEscribir(informe, t0, "no hay sesion de Supabase: entra con tu correo para poder guardar el tramo. No se escribe nada");
    }

    const articulo = texto(fila && fila.articulo);
    const material = texto(fila && fila.material);
    if (!articulo) {
      return sinEscribir(informe, t0, "el tramo necesita el articulo: sin el no hay clave y no se puede guardar");
    }
    const ctx = { token: token, secretos: [token, config.anonKey].filter(Boolean), t0: t0, avisos: [] };

    // La clave se calcula AQUI, no se acepta del que llama. Es la misma regla que
    // aplica el servidor (PP_normalizeKey_ en 02-storage.js:2419 y
    // PP_Inspection_routeKey_ en 16-inspection-service.js): trim, mayusculas, sin
    // acentos y espacios como "_". Si la calculara el que llama, dos paginas con
    // distinta normalizacion meterian dos filas por el mismo tramo, y el indice
    // unico de `clave` no las podria de-duplicar porque estarian en claves
    // distintas. Aceptarla seria cambiar la identidad del dato desde la pagina.
    const clave = normalizeKey(articulo) + "|" + normalizeKey(material);
    const cuerpo = {
      clave: clave,
      articulo: articulo,
      material: material,
      tramo: texto(fila && fila.tramo).slice(0, 100),
      // `actualizado` es lo que la tabla de Catalogos muestra y en la hoja era una
      // celda de TEXTO. Se escribe con el mismo formato que usaba la hoja
      // (dd/MM/yyyy HH:mm:ss) para que la columna siga siendo la misma clase de dato
      // y no se cambie lo que se ve sin que nadie lo pidiera.
      actualizado: texto(fila && fila.actualizado) || momentoDeGuardado(),
    };
    // `dibujo` SOLO si viene en la llamada. La razon: el dialogo de la pagina edita
    // el TRAMO, no el dibujo. Con `dibujo: payload.dibujo || ""` en el cuerpo, cada
    // guardado de tramo borraria el dibujo de esa fila, y el dibujo es justamente el
    // dato que no se esta editando. Un guardado parcial que no manda la columna no
    // la toca (PostgREST manda un UPDATE con las columnas del cuerpo).
    if (fila && Object.prototype.hasOwnProperty.call(fila, "dibujo")) {
      cuerpo.dibujo = texto(fila.dibujo).slice(0, 1000);
    }

    try {
      const respuesta = await pedir(token, "POST", "inspection_routes", {
        cuerpo: cuerpo,
        onConflict: "clave",
        prefer: "resolution=merge-duplicates,return=representation",
      });
      let guardada = null;
      try {
        const cuerpoRespuesta = await respuesta.json();
        if (Array.isArray(cuerpoRespuesta) && cuerpoRespuesta.length) guardada = cuerpoRespuesta[0];
      } catch (error) {
        // return=representation es una cortesia: si el cuerpo no se puede leer, lo
        // que importa es que la escritura SALIO, y eso ya se sabe por el status.
      }
      informe.tablas.inspection_routes = { insertadas: 1, error: null };
      informe.fila = guardada || cuerpo;
    } catch (error) {
      const crudo = sano((error && error.message) || error, ctx.secretos);
      informe.ok = false;
      informe.tablas.inspection_routes = { insertadas: 0, error: crudo };
      // MEDIDO 2026-09-30 en la escritura de catalogos, con este texto de PostgREST:
      //   there is no unique or exclusion constraint matching the ON CONFLICT specification
      // O sea que la tabla NO esta con el DDL aplicado (o el indice unico sobre
      // `clave` se creo como indice PARCIAL, que PostgreSQL no infiere). Es un cambio
      // de esquema y no de la pagina, asi que el aviso lo dice con el archivo que lo
      // arregla en vez de dejar que quien lo lea tenga que saber de Postgres.
      if (/no unique or exclusion constraint matching the ON CONFLICT/i.test(crudo)) {
        informe.avisos.push(
          "a inspection_routes le falta el indice unico sobre (clave), o el que hay es parcial. "
          + "Es un cambio de schema, no de la pagina: aplica docs/schema-inspection-routes.sql"
        );
      }
    }
    return cerrar(informe, t0);
  }

  /** La fecha que la hoja ponia en `Ultima modificacion`, en el mismo formato. */
  function momentoDeGuardado(reloj) {
    const ahora = reloj || new Date();
    const dos = function (n) { return String(n).padStart(2, "0"); };
    return dos(ahora.getDate()) + "/" + dos(ahora.getMonth() + 1) + "/" + ahora.getFullYear()
      + " " + dos(ahora.getHours()) + ":" + dos(ahora.getMinutes()) + ":" + dos(ahora.getSeconds());
  }

  // ---------------------------------------------------------------------------
  //
  // EL HISTORIAL DE IMPRESIONES. Es OTRA tabla (`inspection_history`,
  // docs/schema-inspection-history.sql) y otro escritor, y NO se mezcla con el de
  // arriba a proposito: `inspection_routes` es el CATALOGO de tramos (una fila por
  // articulo+material, se edita a mano, se actualiza) y esta es el HISTORIAL (una fila
  // por impresion, la escribe la pagina sola, NUNCA se actualiza). Un historial que se
  // actualiza no es un historial.
  //
  // POR QUE EXISTE. MEDIDO 2026-10-01: `recordInspectionPrint` de Apps Script
  // escribia la hoja `HISTORIAL_IMPRESION_INSPEC` por el puente, que esta
  // deshabilitado (RULE-SUP-030). La impresion salia igual, porque la app trata el
  // registro como no bloqueante y pregunta ""Imprimir de todos modos?"", pero no
  // quedaba registro en ningun sitio. No era un historial en otro lugar: era un
  // historial SIN LUGAR, y nadie se enteraba.
  //
  // LO QUE ESCRIBE, COLUMNA POR COLUMNA, Y DE DONDE SALE CADA UNA. Las doce de la
  // hoja `HISTORIAL_IMPRESION_INSPEC`, en el mismo orden (la declaracion de esas
  // columnas esta en PP_Inspection_historySheet_, 16-inspection-service.js:666) y con
  // el mapeo que hacia `recordInspectionPrint` (16-inspection-service.js:689):
  //
  //   fecha_hora            <- `momentoDeGuardado()`, el MISMO formato de la hoja
  //   ot                    <- payload.wo
  //   articulo              <- payload.article, 200
  //   cantidad              <- payload.quantity, numerico
  //   estado_trabajo        <- payload.status, 80
  //   semaforo              <- payload.semaphore, 40
  //   alertas               <- payload.alerts unidos con " | "
  //   materiales_pendientes <- "material: cantidad" unidos con " | "
  //   materiales_deficit    <- "material: deficit" unidos con " | "
  //   sin_dibujo            <- "SI" / "NO"
  //   falta_tramo           <- "SI" / "NO"
  //   detalle               <- payload.detail + las operaciones, como objeto
  //
  // Los TRES de texto unido se guardan como texto y no se parten en tablas hijas: la
  // hoja guardaba una linea por impresion y una persona la leia; partirla en tres
  // seria cambiar el dato y el modo de leerlo sin que nadie lo pidiera. El `SI`/`NO`
  // tambien es texto y no boolean por lo mismo (lo que se leia antes era `SI`; el
  // lector acepta las dos formas, ver mapInspectionHistory).
  //
  // EL POST ES UN INSERT Y SIEMPRE. No hay `on_conflict` y no hay indice UNIQUE: dos
  // impresiones de la misma OT en el mismo segundo son DOS impresiones, y un
  // `merge-duplicates` sobre (ot, fecha_hora) se comeria la segunda. Por eso esta tabla
  // NO esta en la whitelist de `ingesta_mirror`, que es borra-e-inserta (RULE-SUP-021).
  //
  // `fecha_hora` Y `printed_at`, LAS DOS. La primera es el texto que la pagina ve, con
  // el formato de la hoja; la segunda es el instante, para ordenar y para auditar. Es el
  // mismo criterio que `actualizado` / `actualizado_at` de los tramos (RULE-INS-001), y
  // por la misma razon: un dato de texto libre que se muestra no se convierte, y el
  // instante se agrega aparte. Las dos salen del MISMO reloj de la misma llamada, asi
  // que no pueden discrepar.
  //
  // SI NO HAY SESION, NO SE ESCRIBE. Igual que `guardarInspectionRoute`: sin token no
  // hay con quien hablar con RLS, y un historial a medias es peor que un historial que
  // no esta, porque el que falta se puede volver a registrar y el que quedo sin fila no
  // se sabe. La app avisa y deja imprimir (el registro nunca fue bloqueante).
  //
  // QUE DEVUELVE. `{ ok, fila, avisos, ms }` con `fila` YAGUARDADO, como el escritor de
  // arriba: quien llama (printInspection) solo necesita `ok`, pero el mismo contrato en
  // las dos escrituras hace que no haya que recordar cual de las dos devuelve que.
  async function guardarInspectionPrint(fila, opciones) {
    const opts = opciones || {};
    const t0 = Date.now();
    const informe = { ok: true, tablas: {}, ms: 0, avisos: [], camino: "inspection_history", fila: null };
    if (!isConfigured()) {
      return sinEscribir(informe, t0, "Supabase no esta configurado en este build: faltan la URL o la clave publicable");
    }
    const auth = root.PPSupabaseAuth;
    if (!auth || typeof auth.token !== "function") {
      return sinEscribir(informe, t0, "no esta PPSupabaseAuth: no hay quien pida el token de sesion");
    }
    const token = await auth.token();
    if (!token) {
      return sinEscribir(informe, t0, "no hay sesion de Supabase: entra con tu correo para que la impresion quede registrada");
    }

    // El folio se acepta en los dos juegos de nombres porque el payload sale de
    // `printInspection` (que manda `wo`) y el que se lee en el historial acepta `ot`
    // o `FOLIO`. Se elige UNO para escribir: la columna es `ot`.
    const folio = texto(fila && (fila.wo || fila.ot || fila.OT || fila.folio));
    if (!folio) {
      return sinEscribir(informe, t0, "la impresion necesita el folio de la OT: sin el no se sabe de que OT es");
    }

    // El texto de una lista de "material: cantidad", con el separador de la hoja.
    const lista = function (items, valorDe) {
      return (Array.isArray(items) ? items : []).map(function (item) {
        return texto(item && (item.material || item.componente || item.MATERIAL)) + ":" + texto(valorDe(item));
      }).filter(function (linea) { return linea.charAt(0) !== ":"; }).join(" | ");
    };
    // `fecha_hora` y `printed_at` salen del MISMO reloj de la misma llamada, como
    // promete el comentario de arriba: si la pagina no manda texto, el texto es la
    // representacion local de `ahora` y el instante es `ahora.toISOString()`. Antes
    // solo se escribia el texto y `printed_at` quedaba NULL (MEDIDO 2026-10-08 leyendo
    // el cuerpo que se manda): el lector ordena por `printed_at.desc.nullslast`, asi
    // que cualquier migracion de la hoja vieja mezclada con filas nuevas pondria las
    // nuevas despues de las viejas sin importar la fecha real.
    const ahora = new Date();
    const cuerpo = {
      ot: folio.slice(0, 80),
      fecha_hora: texto(fila && fila.fecha_hora) || momentoDeGuardado(ahora),
      printed_at: ahora.toISOString(),
      articulo: texto(fila && (fila.articulo || fila.ARTICULO || fila.article)).slice(0, 200),
      cantidad: numero(fila && (fila.cantidad !== undefined ? fila.cantidad : fila.quantity)),
      estado_trabajo: texto(fila && (fila.estado_trabajo || fila.estadoTrabajo || fila.ESTADO_TRABAJO || fila.status)).slice(0, 80),
      semaforo: texto(fila && (fila.semaforo || fila.semaphore || fila.SEMAFORO)).slice(0, 40),
      // `alertas` y `alerts` son la MISMA lista con dos nombres, y solo uno de los dos
      // llega de la pagina. MEDIDO 2026-10-01 con este test: `printInspection`
      // (inspection-app.js) manda la propiedad en ingles, `alerts`, porque asi la
      // nombraba el payload viejo de `recordInspectionPrint` de Apps Script; el
      // escritor la leia como `alertas`, que es el nombre de la COLUMNA y el de la
      // hoja. Con solo uno de los dos, la columna salia VACIA en todas las
      // impresiones y el historial no decia que habia alertas. Se aceptan los dos
      // nombres porque el dato entra de la pagina (ingles) o de una fila vieja
      // (hoja, espanol) y no hay forma de saber de donde viene cada llamada.
      alertas: (Array.isArray(fila && (fila.alertas || fila.alerts))
        ? (fila.alertas || fila.alerts) : [])
        .map(function (a) { return texto(a); }).filter(Boolean).join(" | "),
      materiales_pendientes: lista(fila && (fila.materiales_pendientes || fila.pendingMaterials),
        function (item) { return item && (item.quantity !== undefined ? item.quantity : item.cantidad); }).slice(0, 2000),
      materiales_deficit: lista(fila && (fila.materiales_deficit || fila.deficitMaterials),
        function (item) { return item && item.deficit; }).slice(0, 2000),
      sin_dibujo: (fila && (fila.sin_dibujo || fila.sinDibujo || fila.withoutDrawing)) ? "SI" : "NO",
      falta_tramo: (fila && (fila.falta_tramo || fila.faltaTramo || fila.missingRoutes)) ? "SI" : "NO",
      // El detalle es un OBJETO en jsonb, no el texto de la hoja. El servidor hacia
      // `JSON.stringify(detail)` porque la celda era de texto; aqui el tipo lo lleva
      // la columna, y mandar el texto seria escribir un json dentro de un json.
      detalle: (function () {
        const base = fila && fila.detalle && typeof fila.detalle === "object" ? fila.detalle : (fila && fila.detail && typeof fila.detail === "object" ? fila.detail : {});
        const operaciones = (Array.isArray(fila && fila.operations) ? fila.operations : [])
          .map(function (value) { return texto(value); }).filter(Boolean);
        return Object.assign({}, base, { operations: operaciones });
      })(),
    };

    const ctx = { token: token, secretos: [token, config.anonKey].filter(Boolean), t0: t0, avisos: [] };
    try {
      const respuesta = await pedir(token, "POST", "inspection_history", {
        cuerpo: cuerpo,
        prefer: "return=representation",
      });
      let guardada = null;
      try {
        const cuerpoRespuesta = await respuesta.json();
        if (Array.isArray(cuerpoRespuesta) && cuerpoRespuesta.length) guardada = cuerpoRespuesta[0];
      } catch (error) {
        // return=representation es una cortesia: si el cuerpo no se puede leer, lo que
        // importa es que la escritura SALIO, y eso ya lo dice el status.
      }
      informe.tablas.inspection_history = { insertadas: 1, error: null };
      informe.fila = guardada || cuerpo;
    } catch (error) {
      const crudo = sano((error && error.message) || error, ctx.secretos);
      informe.ok = false;
      informe.tablas.inspection_history = { insertadas: 0, error: crudo };
      // MEDIDO 2026-10-01: sin esta tabla, PostgREST responde 404 con
      // "Could not find the table 'public.inspection_history' in the schema cache",
      // que no dice de donde sale el problema. El aviso nombra el archivo que lo
      // arregla, igual que el de `inspection_routes` con el ON CONFLICT.
      if (/Could not find the table|schema cache|PGRST205/i.test(crudo)) {
        informe.avisos.push(
          "no existe la tabla inspection_history. Es un cambio de schema, no de la pagina: "
          + "aplica docs/schema-inspection-history.sql"
        );
      }
    }
    return cerrar(informe, t0);
  }

  /**
   * guardarPlanStatuses -> escribe SOLO `operation_plan_statuses`, por UPSERT en `key`.
   *
   * POR QUE EXISTE ESTA FUNCION Y NO UN ALIAS. MEDIDO 2026-10-02:
   * `PPSupabaseBridgeReplacement.getWriter()` exigia `writer.guardarPlan`, y este modulo
   * exporta `guardar`. O sea que `saveOperationPlanStatus` - el await que hace
   * `persistOptimisticPlanStatus` (app.js:9352) cada vez que se pulsa Completar o Reabrir
   * en el detalle de una OT - lanzaba "PPSupabaseWriter no esta disponible" ANTES de
   * escribir nada, y el catch de app.js:9369 revierte el estado optimista. O sea que el
   * boton del detalle no guardaba NADA y la persona veia el estado cambiar y volver.
   * El defecto ya estaba escrito en este archivo, en el comentario de
   * `saveInspectionLink` (supabase-bridge-replacement.js:646), y se arreglo ahi, no aqui.
   *
   * POR QUE NO SE USA `guardar`. `guardar(state, opciones)` arma el payload COMPLETO y lo
   * manda por el RPC `plan_guardar`, que hace `delete` + `insert` en `selected_ots`,
   * `locked_ots` y `operation_plan_statuses` (docs/schema-supabase-plan.sql:831). Con un
   * payload que trae SOLO las filas tocadas, ese delete se llevaria por delante todos los
   * estados de operacion que no venian en la llamada. Un UPSERT por `key` no puede pasar
   * eso: escribe las filas que le dieron y no toca ninguna otra.
   *
   * LA CLAVE NO SE ACEPTA DEL QUE LLAMA, sale del DDL: `plan_tabla_escritura` declara
   * `('operation_plan_statuses', 'espejo', 'key', ...)` (docs/schema-supabase-plan.sql:608)
   * y `CLAVE_NATURAL.operation_plan_statuses` es "key". Las filas las arma
   * `filasPlanStatuses`, el MISMO mapeador que usa el camino del plan completo, para que
   * este camino estrecho y el ancho no puedan divergir en los nombres de columna.
   *
   * LO QUE NO HACE, DICHO: no sube la revision y no manda `app_state`. La revision la
   * sube el guardado del plan (`guardar` -> `plan_guardar`), que es el que la compara.
   */
  async function guardarPlanStatuses(datos, opciones) {
    const opts = opciones || {};
    const t0 = Date.now();
    const informe = { ok: true, tablas: {}, ms: 0, avisos: [], camino: "operation_plan_statuses" };
    if (!isConfigured()) {
      return sinEscribir(informe, t0, "Supabase no esta configurado en este build: faltan la URL o la clave publicable");
    }
    const auth = root.PPSupabaseAuth;
    if (!auth || typeof auth.token !== "function") {
      return sinEscribir(informe, t0, "no esta PPSupabaseAuth: no hay quien pida el token de sesion");
    }
    const token = await auth.token();
    if (!token) {
      return sinEscribir(informe, t0, "no hay sesion de Supabase: entra con tu correo para poder guardar. No se escribe nada");
    }
    const filas = filasPlanStatuses({ operationPlanStatuses: (datos || {}).operationPlanStatuses }, 0)
      // MEDIDO 2026-10-02. `filasPlanStatuses` pone `revision` porque su unico
      // llamador es el RPC, donde la sobreescribe la funcion. Aqui la llamada es
      // DIRECTA a PostgREST, asi que la revision que mandara la pagina seria la de
      // un guardado que todavia no ha pasado, y `plan_tabla_escritura` lo dice
      // explicito: la lista de columnas de `operation_plan_statuses` NO incluye
      // `revision` y la nota dice "revision la pone la funcion"
      // (docs/schema-supabase-plan.sql:608-610). Por eso se quita de las filas en
      // vez de inventar un numero: el default de la base se encarga.
      .map((fila) => {
        const copia = Object.assign({}, fila);
        delete copia.revision;
        return copia;
      });
    if (!filas.length) {
      // Sin filas no hay nada que escribir, y eso NO es un fallo: el llamador puede
      // tener una lista vacia porque solo habia estados que ya estaban como pedia.
      return cerrar(informe, t0, true);
    }
    const ctx = { token: token, secretos: [token, config.anonKey].filter(Boolean), t0: t0, avisos: [] };
    const clave = CLAVE_NATURAL.operation_plan_statuses;
    informe.tablas.operation_plan_statuses = await escribirAnexo(ctx, "operation_plan_statuses", filas, clave);
    if (informe.tablas.operation_plan_statuses.error && opts.motivoDeError) {
      informe.motivo = opts.motivoDeError;
    }
    return cerrar(informe, t0);
  }

  /**
   * guardarPlanSnapshot -> escribe SOLO `plan_snapshots`, por UPSERT en `snapshot_id`.
   *
   * MEDIDO 2026-10-02 contra el schema cache que sirve PostgREST, que es exactamente lo
   * que el navegador puede escribir. La tabla tiene 12 columnas y el dato que importa:
   *
   *   - NO HAY columna `status`. Este modulo y el reemplazo mandaban `status: "BORRADOR"`,
   *     que es un HTTP 400 `42703 column not found`. El estado de la instantanea vive
   *     DENTRO del `payload` jsonb: asi lo lee `planSnapshotFromRow`
   *     (supabase-bridge-replacement.js:897) y asi esta la fila real de `draft`.
   *   - La unica NOT NULL SIN default es `snapshot_id`. `operations`, `plan_start`,
   *     `version`, `usuario` y `publication_reason` tienen default, y `id` y `created_at`
   *     tambien. Por eso esta funcion manda solo lo que trae el snapshot y deja que los
   *     defaults llenen el resto: mandarlas vacias BORRARIA en un merge lo que la fila ya
   *     tenia.
   *   - El cuerpo del plan viaja en `payload` como OBJETO, no como texto: la fila real
   *     de `draft` trae 447375 caracteres de jsonb.
   *
   * EL CONTRATO ES EL DEL RPC, NO EL DEL MAPEADOR DE COLUMNAS. `plan_guardar` inserta tres
   * columnas: `insert into public.plan_snapshots (snapshot_id, payload, created_at)`
   * (docs/schema-supabase-plan.sql:863-865). Este UPSERT manda esas tres, mas
   * `published_at` cuando se publica. NO usa `filasSnapshots` (el mapeador del camino
   * viejo, que escribe `operations`, `plan_start`, `version`, `usuario`, `change_summary` y
   * `publication_reason` y NO escribe `payload`): con ese la fila se guardaria sin cuerpo
   * y la pagina leeria un borrador vacio.
   *
   * `created_at` va con el instante del snapshot y no con el del reloj, por el mismo
   * motivo que en `filasSnapshotsRpc`: recargar y volver a guardar no debe cambiarle la
   * hora a un borrador que ya estaba. Sin fecha no se manda la columna y la pone `now()`.
   */
  async function guardarPlanSnapshot(fila, opciones) {
    const opts = opciones || {};
    const t0 = Date.now();
    const informe = { ok: true, tablas: {}, ms: 0, avisos: [], camino: "plan_snapshots", fila: null };
    if (!isConfigured()) {
      return sinEscribir(informe, t0, "Supabase no esta configurado en este build: faltan la URL o la clave publicable");
    }
    const auth = root.PPSupabaseAuth;
    if (!auth || typeof auth.token !== "function") {
      return sinEscribir(informe, t0, "no esta PPSupabaseAuth: no hay quien pida el token de sesion");
    }
    const token = await auth.token();
    if (!token) {
      return sinEscribir(informe, t0, "no hay sesion de Supabase: entra con tu correo para poder guardar. No se escribe nada");
    }
    const data = fila || {};
    const snapshotId = texto(data.snapshot_id || data.snapshotId);
    if (!snapshotId) {
      return sinEscribir(informe, t0,
        "la instantanea necesita su snapshot_id: es la unica NOT NULL sin default, y sin ella no hay clave ni UPSERT posible");
    }
    const cuerpo = { snapshot_id: snapshotId, payload: cuerpoDePayload(data) };
    const createdAt = instante(data.created_at || data.createdAt || data.generatedAt || data.publishedAt, "");
    if (createdAt) cuerpo.created_at = createdAt;
    const publishedAt = instante(data.publishedAt || data.published_at, "");
    if (publishedAt) cuerpo.published_at = publishedAt;
    const ctx = { token: token, secretos: [token, config.anonKey].filter(Boolean), t0: t0, avisos: [] };
    // `snapshot_id text not null unique` (docs/schema-supabase.sql:305). Sin `on_conflict`,
    // PostgREST usaria la primary key, que es el uuid que la pagina nunca manda, y cada
    // guardado del borrador entraria como fila nueva en vez de reemplazar la de 'draft'.
    informe.tablas.plan_snapshots = await escribirAnexo(ctx, "plan_snapshots", [cuerpo], "snapshot_id");
    if (informe.tablas.plan_snapshots.error && opts.motivoDeError) informe.motivo = opts.motivoDeError;
    return cerrar(informe, t0);
  }

  /**
   * El cuerpo de la instantanea como OBJETO jsonb. Si llega texto se parsea, porque el
   * RPC acepta las dos formas y `planSnapshotPayload` tambien las lee, pero lo que se MANDA
   * es el objeto: mandar `JSON.stringify(...)` guardaria un jsonb que es una cadena, no un
   * plan.
   */
  function cuerpoDePayload(data) {
    const fuente = data && data.payload != null ? data.payload : data;
    if (fuente == null) return {};
    if (typeof fuente === "string") {
      try {
        const parseado = JSON.parse(fuente);
        return parseado && typeof parseado === "object" && !Array.isArray(parseado) ? parseado : {};
      } catch {
        return {};
      }
    }
    return typeof fuente === "object" && !Array.isArray(fuente) ? fuente : {};
  }

  /**
   * app_state tiene UNA fila (id integer, check id = 1): se ACTUALIZA, no se
   * inserta. Un POST crearia una fila que el check del DDL no deja crear, y un
   * borrado previo dejaria la pagina sin revision.
   */
  async function parchearAppState(ctx, fila) {
    try {
      await pedir(ctx.token, "PATCH", "app_state", { cuerpo: fila, columna: "id", valor: "eq.1" });
      return { insertadas: 0, error: null };
    } catch (error) {
      return { insertadas: 0, error: sano((error && error.message) || error, ctx.secretos) };
    }
  }

  /**
   * operation_events: UN POST POR EVENTO, y jamas un DELETE. Con el id
   * determinista y resolution=merge-duplicates, repetir el mismo evento actualiza
   * la fila en vez de duplicarla, asi que el flujo sigue siendo idempotente.
   * `at` no se manda a proposito: lo pone el default now() en el INSERT y, al no
   * venir en el payload, el DO UPDATE lo conserva; asi la segunda pasada del mismo
   * evento no le cambia la hora.
   */
  async function escribirEventos(ctx, filas) {
    let insertadas = 0;
    let omitidas = 0;
    let corte = false;
    for (const fila of filas) {
      // Un evento que ya salio de ESTA pagina esta en la tabla: su id es
      // determinista y lo que se mando fue un upsert. No se vuelve a pedir, que
      // seria pagar otra vez una escritura que no cambia nada.
      if (eventosEnviados.has(fila.id)) { insertadas += 1; continue; }
      if (corte) { omitidas += 1; continue; }
      if (Date.now() - ctx.t0 > PRESUPUESTO_MS) { corte = true; omitidas += 1; continue; }
      try {
        await pedir(ctx.token, "POST", "operation_events", {
          cuerpo: [fila],
          onConflict: "id",
          prefer: "resolution=merge-duplicates,return=minimal",
        });
        eventosEnviados.add(fila.id);
        insertadas += 1;
      } catch (error) {
        // Un evento que falla no se come el guardado entero: se cuenta y se sigue.
        omitidas += 1;
        if (!corte) corte = true;
        ctx.avisos.push(sano((error && error.message) || error, ctx.secretos));
      }
    }
    const error = omitidas
      ? "se omitieron " + omitidas + " evento(s) tras " + PRESUPUESTO_MS + " ms: " + (ctx.avisos[0] || "sin detalle")
      : null;
    // insertadas son los eventos del estado que quedan en la tabla al terminar,
    // no los POST que salieron: por eso dos guardados seguidos dan el mismo
    // numero. Un guardado en una pagina nueva los manda otra vez, y el
    // upsert sobre el mismo id no crea filas nuevas.
    return { insertadas: insertadas, error: error };
  }

  // ---------------------------------------------------------------------------
  // Conversiones
  // ---------------------------------------------------------------------------

  function texto(valor) { return String(valor == null ? "" : valor).trim(); }

  /**
   * La MISMA normalizacion del servidor y del lector, copiada de proposito:
   *   PP_normalizeKey_            src/server/02-storage.js:2419
   *   normalizeKey                src/web/shared/supabase-reader.js:252
   * trim + mayusculas + sin acentos + espacios como "_".
   *
   * POR QUE COPIADA Y NO IMPORTADA. El escritor no importa al lector (el lector es
   * solo lectura y no debe arrastrar dependencias de escritura), y en el navegador
   * plano los dos son scripts sueltos sin modulos. Copiar tres lineas con el
   * nombre del origen al lado es lo que hace que un cambio en una de las tres se
   * note en la revision: si en cambio se llama al del lector, el escritor deja de
   * escribir en cuanto el lector se apaga por no tener sesion, que es un fallo de
   * escritura disfrazado de lectura.
   */
  function normalizeKey(valor) {
    return String(valor == null ? "" : valor).trim().toUpperCase().normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, "_");
  }

  function numero(valor, porDefecto) {
    const defecto = porDefecto === undefined ? 0 : porDefecto;
    if (valor === null || valor === undefined || texto(valor) === "") return defecto;
    const n = Number(valor);
    return isFinite(n) ? n : defecto;
  }

  function booleano(valor, porDefecto) {
    if (valor === true || valor === false) return valor;
    const t = texto(valor).toUpperCase();
    if (t === "TRUE" || t === "VERDADERO" || t === "SI" || t === "1") return true;
    if (t === "FALSE" || t === "FALSO" || t === "NO" || t === "0") return false;
    return porDefecto;
  }

  /**
   * jsonb: pasa el objeto tal cual. Acepta tambien un texto que ya sea JSON
   * (viene de las Hojas, donde se guardaba como cadena) y, si no es JSON, cae en
   * el valor por defecto. Nunca manda una cadena suelta: una columna jsonb con
   * texto que no es JSON revienta el INSERT entero y, sin transaccion, deja la
   * tabla a medio escribir.
   */
  function jsonb(valor, porDefecto) {
    if (valor === null || valor === undefined) return porDefecto;
    if (typeof valor === "object") return valor;
    const t = texto(valor);
    if (!t) return porDefecto;
    try { return JSON.parse(t); } catch { return porDefecto; }
  }

  /**
   * fecha + hora del estado -> un instante ISO en UTC.
   *
   * En el estado la fecha y la hora van separadas (PP_OPERATION_FIELDS:
   * fechaInicio / horaInicio) y en Supabase la columna es timestamptz, o sea que
   * hay que unirlas. Mismo criterio que isoFechaHora_ del RESTlet 2246
   * (netsuite-restlet-unificado-supabase.js:396): la hora de la pared se toma
   * como UTC, porque las fechas de la hoja no llevan zona.
   *
   * A diferencia de ahi, lo que no es una fecha devuelve null en vez del texto
   * crudo: un texto que Postgres no acepta revienta el INSERT de la tabla
   * entera (RULE-SUP-021) y no hay rollback que lo arregle.
   */
  function instante(fecha, hora) {
    const f = texto(fecha);
    if (!f) return null;
    const h = texto(hora);
    // Una fecha que YA trae zona (el estado guarda savedAt, syncedAt y completedAt
    // con el Z de toISOString) es inequivoca: se respeta tal cual y la hora del
    // estado no interviene. Un instante CON zona no se reinterpreta como hora de
    // pared, que es lo que se hace con las fechas que no la traen.
    if (/^\d{4}-\d{2}-\d{2}[T ]\d{1,2}:\d{2}(:\d{2})?(\.\d+)?(Z|[+-]\d{2}:?\d{2})$/i.test(f)) {
      const directo = new Date(f);
      return isNaN(directo.getTime()) ? null : directo.toISOString();
    }
    let anio = 0;
    let mes = 0;
    let dia = 0;
    let hh = 0;
    let mm = 0;
    let ss = 0;
    let conHora = false;
    const iso = /^(\d{4})-(\d{2})-(\d{2})(?:[ T](\d{1,2}):(\d{2})(?::(\d{2}))?)?$/.exec(f);
    if (iso) {
      anio = Number(iso[1]);
      mes = Number(iso[2]) - 1;
      dia = Number(iso[3]);
      if (iso[4]) { hh = Number(iso[4]); mm = Number(iso[5]); ss = iso[6] ? Number(iso[6]) : 0; conHora = true; }
    } else {
      // "dd/MM/aaaa" tambien llega de NetSuite y de las hojas.
      const lat = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(f);
      if (!lat) return null;
      dia = Number(lat[1]);
      mes = Number(lat[2]) - 1;
      anio = Number(lat[3]);
    }
    // La hora del estado manda si la hubo, porque en PP_OPERATION_FIELDS la
    // fecha y la hora son campos distintos y la tabla tiene una columna para cada
    // uno. Si la fecha ya traia hora (fichero de la ingesta), esa gana.
    if (!conHora && h) {
      const hm = /^(\d{1,2}):(\d{2})(?::(\d{2}))?$/.exec(h);
      if (!hm) return null;
      hh = Number(hm[1]);
      mm = Number(hm[2]);
      ss = hm[3] ? Number(hm[3]) : 0;
    }
    // Hora fuera de rango se rechaza en vez de dejarse rodar: Date.UTC(99, 99)
    // devuelve una fecha de otro dia, y se estaria guardando una fecha que nadie
    // escribio. El estado llega con horas crudas de la hoja.
    if (hh > 23 || mm > 59 || ss > 59) return null;
    const d = new Date(Date.UTC(anio, mes, dia, hh, mm, ss));
    if (isNaN(d.getTime())) return null;
    // Date.UTC normaliza el 31 de un mes corto rodandolo; se devuelve null en vez
    // de la fecha corrida.
    if (d.getUTCFullYear() !== anio || d.getUTCMonth() !== mes || d.getUTCDate() !== dia) return null;
    return d.toISOString();
  }

  // ---------------------------------------------------------------------------
  // Mapeo: shape del estado -> columnas de la tabla
  //
  // Los nombres de columna NO son inventados: salen de .openchamber/esquema-
  // supabase.json (el esquema medido), de docs/schema-supabase-plan.sql (el DDL
  // del plan) y del sentido contrario, que ya esta escrito y probado, en
  // supabase-reader.js y en el espejo de catalogos (16-supabase-catalogo.js).
  // Los nombres de campo del estado son los de PP_OPERATION_FIELDS y
  // PP_mapWorkOrder_/PP_mapMaterial_ (02-storage.js).
  // ---------------------------------------------------------------------------

  /**
   * La clave normalizada de una OT, para comparar `operations[].ot` con `selectedOts`
   * sin depender de mayusculas ni espacios. Es la misma normalizacion que usa la pagina
   * (normalizeStatus, app.js:13884) menos el relleno con "PLAN": aqui una OT vacia tiene
   * que seguir siendo vacia.
   */
  function claveOt(valor) {
    return texto(valor).toUpperCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  }

  /**
   * Las OTs del plan (`selectedOts` + `lockedOts`), normalizadas, o null cuando no hay
   * plan contra el que recortar.
   *
   * MEDIDO 2026-10-10: el cuerpo de `operations` mandaba las 2.236 filas de la pagina
   * (1.884.421 B) cuando el plan solo tiene 115 OTs (1.256 de esas filas): casi la mitad
   * del cuerpo era eco de operaciones que la pagina acaba de LEER y que el plan no usa.
   * Mandar solo las del plan escribe EXACTAMENTE lo mismo, por dos razones que estan en
   * el DDL: `plan_guardar` escribe `operations` en modo `actualiza` (UPDATE por
   * operation_id, docs/schema-supabase-plan.sql:735-808), asi que una fila que no se
   * manda queda con su valor anterior y no se borra ni se vacia; y la senal de que una
   * operacion salio del plan NO depende de esta lista: la funcion la deduce del diff de
   * `selected_ots` (lineas 810-829).
   *
   * Si `selectedOts` esta vacio (una importacion, un estado recien nacido) no hay lista
   * contra la que recortar y se manda todo, que es el comportamiento de siempre: recortar
   * es una optimizacion de tamano, no un cambio de lo que se guarda.
   */
  function otsDelPlan(state) {
    const vistas = new Set();
    ["selectedOts", "lockedOts"].forEach((campo) => {
      (Array.isArray(state[campo]) ? state[campo] : []).forEach((valor) => {
        const clave = claveOt(valor);
        if (clave) vistas.add(clave);
      });
    });
    return vistas.size ? vistas : null;
  }

  function filasOperations(state, revision) {
    const filas = [];
    const vistas = new Set();
    const planOts = otsDelPlan(state);
    (Array.isArray(state.operations) ? state.operations : []).forEach((op) => {
      if (!op || typeof op !== "object") return;
      // operation_id es NOT NULL UNIQUE (el id estable de la operacion). Una
      // operacion sin id no se puede escribir y no se le inventa uno: se sale.
      const operationId = texto(op.id);
      if (!operationId) return;
      // El eco de las operaciones fuera del plan no lo necesita ni el plan ni la
      // funcion (ver otsDelPlan).
      if (planOts && !planOts.has(claveOt(op.ot))) return;
      if (vistas.has(operationId)) return;
      vistas.add(operationId);
      const inicio = instante(op.fechaInicio, op.horaInicio);
      const fin = instante(op.fechaFin, op.horaFin);
      filas.push({
        operation_id: operationId,
        ot: texto(op.ot),
        secuencia: Math.round(numero(op.secuencia, 0)),
        ct: texto(op.ct),
        descripcion: texto(op.descripcion),
        operador: texto(op.operador),
        maquina: texto(op.maquina),
        herramental: texto(op.herramental),
        kit: texto(op.kitHerramental),
        cant_total: Math.round(numero(op.cantTotal, 0)),
        cant_pendiente: Math.round(numero(op.cantPendiente, 0)),
        tiempo_ciclo: numero(op.tiempoCiclo, 0),
        tiempo_setup: numero(op.tiempoSetup, 0),
        tiempo_prod: numero(op.tiempoProd, 0),
        fecha_inicio: inicio,
        // hora_inicio es timestamptz, no una hora suelta: lleva el mismo instante
        // que fecha_inicio, porque el estado los separa y la tabla no.
        hora_inicio: inicio,
        fecha_fin: fin,
        hora_fin: fin,
        tipo_insercion: texto(op.tipoInsercion) || "OPERACION",
        estatus: texto(op.estatus) || "PLAN",
        locked: booleano(op.locked, false),
        auto_frozen: booleano(op.autoFrozen, false),
        subcontract_type: texto(op.subcontractType),
        subcontract_days: Math.round(numero(op.subcontractDays, 0)),
        // Columnas que agrega el DDL del plan (docs/schema-supabase-plan.sql:60-67).
        num: Math.round(numero(op.num, 0)),
        parte: texto(op.parte),
        contenido: texto(op.contenido),
        // prioridad es TEXT y no integer porque la app acepta numero o palabra
        // (normalizePriority); mandarla como texto vale para las dos.
        prioridad: texto(op.prioridad),
        fecha_req: texto(op.fechaReq),
        comentario: texto(op.comentario),
        tiempo_fallback: numero(op.tiempoFallback, 0),
        kit_pending: booleano(op.kitPending, false),
        // Columnas nuevas del plan: completado, tipo, precio, clasificacion
        completado: booleano(op.completado, false),
        tipo: texto(op.tipo),
        precio: numero(op.precio, 0),
        clasificacion: texto(op.clasificacion),
        revision: revision,
      });
    });
    return filas;
  }

  function filasWorkOrders(state, revision) {
    const filas = [];
    const vistas = new Set();
    (Array.isArray(state.workOrders) ? state.workOrders : []).forEach((wo) => {
      if (!wo || typeof wo !== "object") return;
      const ot = texto(wo.ot);
      if (!ot) return;
      if (vistas.has(ot)) return;
      vistas.add(ot);
      filas.push({
        ot: ot,
        wo_internal_id: texto(wo.workOrderId),
        articulo: texto(wo.item),
        descripcion: texto(wo.description),
        // foto_url NO se escribe desde aqui, por el mismo motivo por el que machines no se
        // escribe (RULE-SUP-010, un solo escritor por tabla). MEDIDO 2026-10-01: la foto la
        // produce la INGESTA (src/server/09-photos.js, PP_enrichPhotoRows_, la URL de Drive) y
        // la unica pagina que pinta la foto es esta, que no tiene ningun control para ponerla.
        // O sea que este `texto(wo.photoUrl)` era un eco: devolvia lo que la pagina acaba de
        // LEER, y cuando la foto_url guardada no era una URL que safePhotoUrl acepta
        // (http, una ruta de red, un id viejo) el eco no era la foto, era la CADENA VACIA, y
        // el upsert la dejaba en ''. Con eso, guardar el plan borraba la foto de Drive de
        // esas OTs y no regresaba hasta la siguiente ingesta, sin decir nada. El lector ya
        // trae foto_url (supabase-reader.js, mapWorkOrders) y la pagina ya la muestra.
        // Estas tres son timestamptz y en el estado son fecha sin hora.
        fecha_inicio_ns: instante(wo.startDate, ""),
        fecha_fin_ns: instante(wo.endDate, ""),
        fecha_vencimiento: instante(wo.dueDate, ""),
        due_date_override: texto(wo.dueDateOverride),
        cantidad: Math.round(numero(wo.quantity, 0)),
        estatus: texto(wo.status),
        cliente: texto(wo.customer),
        cant_ensamblada: Math.round(numero(wo.builtQuantity, 0)),
        cant_pendiente: Math.round(numero(wo.pendingQuantity, 0)),
        precio_promedio_venta: numero(wo.averageSalePrice, 0),
        precio_ultima_venta: numero(wo.lastSalePrice, 0),
        // precio_desde y precio_hasta NO se escriben. El DDL las declara numeric
        // y la app lleva en esos dos campos una VENTANA DE FECHAS
        // (normalizeWorkOrders los pasa por normalizeOtDate). Mandar una fecha en
        // una columna numeric revienta el INSERT entero. Es un conflicto real de
        // tipos entre el DDL y el estado, y se declara en vez de adivinar.
        revision: revision,
      });
    });
    return filas;
  }

  function filasMaterials(state, revision) {
    const filas = [];
    const vistas = new Set();
    (Array.isArray(state.materials) ? state.materials : []).forEach((m) => {
      if (!m || typeof m !== "object") return;
      const ot = texto(m.ot);
      // MEDIDO 2026-10-04, POR QUE ESTA LINEA CAMBIO Y QUE ESTABA MAL. Antes decia
      // `const linea = texto(m.id)`, con el comentario de que `id` era "el identificador de
      // fila que la app SI tiene". Es cierto que la app lo tiene, y por eso la clave estaba
      // mal: `materials` tiene DOS escritores y NO usan la misma clave.
      //   - la ingesta (RESTlet 2246, materiales_) escribe `line_id` = `comp.id`, el id de
      //     renglon de NetSuite. MEDIDO: '2', '3', '4', '24'.
      //   - esta pagina ponia `line_id` = `id`, el UUID de la fila que acababa de LEER.
      //     MEDIDO en la OT 3374: la copia tiene `id` '68d0519a-...' y `line_id`
      //     'c1f3421a-...', y la fila original de la MISMA MP tiene `id` 'c1f3421a-...': la
      //     copia se creo usando el id de la original como clave.
      // El UNIQUE es (ot, line_id). Con dos claves distintas para el mismo renglon de BOM, el
      // `merge-duplicates` de `escribirEspejo` no puede emparejar las filas y INSERTA. MEDIDO
      // en la base: 697 filas para 348 (ot, componente) distintos, 348 con mas de una fila,
      // 349 filas de mas y una con tres (cada guardado anadia otra copia). Y el efecto en la
      // hoja de inspeccion era que cada MP salia DOS VECES, lado a lado.
      //
      // LA CLAVE CORRECTA ES `lineId`, que es el `line_id` de la fila leida (lo expone
      // `mapMaterials`, supabase-reader.js:1152) y que es el que escribio la ingesta: con
      // esa clave el UPSERT actualiza la fila del ERP. El respaldo a `m.id` es solo para un
      // material que venga de OTRO origen sin `lineId` (un import, un estado viejo): ahi no
      // hay mejor clave, y es la misma que habia antes.
      const linea = texto(m.lineId) || texto(m.id);
      if (!ot || !linea) return;
      const clave = ot + "|" + linea;
      if (vistas.has(clave)) return;
      vistas.add(clave);
      filas.push({
        ot: ot,
        wo_internal_id: texto(m.workOrderId),
        ensamble: texto(m.assembly),
        line_id: linea,
        componente_id: texto(m.componentId),
        componente: texto(m.component),
        descripcion: texto(m.description),
        unidad: texto(m.unit),
        // requerido/emitido/pendiente se escriben FRACCIONARIOS, sin Math.round
        // (RULE-SUP-046): las cantidades de BOM son fraccionarias (0.127, 0.49742) y
        // redondearlas a 0 dejaba 50 OTs sin MP en la hoja de inspeccion.
        requerido: numero(m.required, 0),
        emitido: numero(m.issued, 0),
        pendiente: numero(m.pending, 0),
        revision: revision,
      });
    });
    return filas;
  }

  function filasSelectedOts(state) {
    const filas = [];
    const vistas = new Set();
    (Array.isArray(state.selectedOts) ? state.selectedOts : []).forEach((valor) => {
      const ot = texto(typeof valor === "object" && valor ? valor.ot : valor);
      if (!ot || vistas.has(ot)) return;
      vistas.add(ot);
      // posicion es NOT NULL y es el orden manual de la cola (RULE-OT-005), o sea
      // que viaja el indice del array y no la posicion dentro de lo que si paso
      // el filtro de unicidad.
      filas.push({ ot: ot, posicion: filas.length });
    });
    return filas;
  }

  function filasLockedOts(state) {
    const filas = [];
    const vistas = new Set();
    (Array.isArray(state.lockedOts) ? state.lockedOts : []).forEach((valor) => {
      const ot = texto(typeof valor === "object" && valor ? valor.ot : valor);
      if (!ot || vistas.has(ot)) return;
      vistas.add(ot);
      filas.push({ ot: ot });
    });
    return filas;
  }

  function filasPlanStatuses(state, revision) {
    const filas = [];
    const vistas = new Set();
    const fuente = state.operationPlanStatuses;
    const lista = Array.isArray(fuente) ? fuente : Object.keys(fuente && typeof fuente === "object" ? fuente : {}).map((k) => fuente[k]);
    lista.forEach((item) => {
      if (!item || typeof item !== "object") return;
      const key = texto(item.key);
      if (!key) return;
      if (vistas.has(key)) return;
      vistas.add(key);
      filas.push({
        key: key,
        ot: texto(item.ot),
        secuencia: Math.round(numero(item.sequence, 0)),
        ct: texto(item.ct),
        status: texto(item.status) || "PENDIENTE",
        origin: texto(item.origin) || "draft",
        fecha_completado: instante(item.completedAt, ""),
        fecha_reapertura: instante(item.reopenedAt, ""),
        revision: revision,
      });
    });
    return filas;
  }

  /**
   * unconfirmed_work_orders: las marcas de OT "por confirmar" (RULE-OT-051 capa 2).
   *
   * POR QUE SE SUBEN COMO ANEXO Y NO COMO ESPEJO. La columna `ot` es UNIQUE, asi que
   * escribir por clave natural es idempotente y dos paginas no se pisan. Y NO se borra
   * lo que la pagina ya no trae: una marca que esta en la base y no en esta pantalla
   * puede ser de OT que esta cerrada en NetSuite y que la pagina todavia no sabe; si se
   * borrara, se perderia el contador `misses` que es justamente lo que decide cuando la
   * marca es real (ver mergeUnconfirmedWorkOrderMarks en app.js).
   *
   * `first_seen_at` y `last_seen_at` tienen default now() en el DDL, pero se mandan
   * explicitas: el instante de cuando ESTA pagina vio la OT es el dato, no el de cuando
   * se escribio la fila.
   */
  function filasUnconfirmedWorkOrders(state) {
    const marcas = state && typeof state.unconfirmedWorkOrders === "object" ? state.unconfirmedWorkOrders : {};
    const filas = [];
    Object.keys(marcas).forEach((clave) => {
      const marca = marcas[clave];
      if (!marca || typeof marca !== "object") return;
      const ot = texto(marca.ot !== undefined ? marca.ot : clave);
      if (!ot) return;
      filas.push({
        ot: ot,
        first_seen_at: instante(marca.firstSeenAt, ""),
        last_seen_at: instante(marca.lastSeenAt, ""),
        misses: Math.round(numero(marca.misses, 1)) || 1,
      });
    });
    return filas;
  }

  /**
   * closed_work_order_summaries: lo que se recuerda de una OT que se cerro (item, cantidad,
   * cuando se detecto el cierre). La columna `summary` es jsonb y la forma la fija
   * mergeClosedWorkOrderSummaries en app.js, que es quien la consume al volver a cargar.
   */
  function filasClosedWorkOrderSummaries(state) {
    const resumenes = state && typeof state.closedWorkOrderSummaries === "object" ? state.closedWorkOrderSummaries : {};
    const filas = [];
    Object.keys(resumenes).forEach((clave) => {
      const resumen = resumenes[clave];
      if (!resumen || typeof resumen !== "object") return;
      const ot = texto(resumen.ot !== undefined ? resumen.ot : clave);
      if (!ot) return;
      filas.push({ ot: ot, summary: jsonb(resumen, {}) });
    });
    return filas;
  }

  /**
   * app_state: la fila unica. Solo las columnas que el DDL de
   * docs/schema-supabase.sql:257-271 tiene; las demas del estado (operators,
   * matrix, machines, settings de la matriz...) viven en sus propias tablas de
   * catalogo y no se aplanan aqui.
   */
  function filaAppState(state, revision) {
    return {
      revision: revision,
      saved_at: instante(state.savedAt, ""),
      synced_at: instante(state.syncedAt, ""),
      plan_start: texto(state.planStart),
      horizon_days: Math.round(numero(state.horizonDays, 15)),
      report_week_start: texto(state.reportWeekStart),
      report_filters: jsonb(state.reportFilters, {}),
      settings: jsonb(state.settings, {}),
      plant: jsonb(state.plant, {}),
      operation_catalog_warning: texto(state.operationCatalogWarning),
      last_schedule: jsonb(state.lastSchedule, null),
      // RULE-OT-057: firma "ya preparado" por OT. Sin columna, la firma vivia solo en
      // cache local y "Generar plan" reabria el dialogo de detalles tras cada carga.
      prepared_planning_by_ot: jsonb(state.preparedPlanningByOt, {}),
    };
  }

  /**
   * app_state para plan_guardar: la MISMA fila sin `revision`.
   *
   * Por que sin revision: la funcion la incrementa y la escribe ella
   * (docs/schema-supabase-plan.sql:701). Si el payload trajera una, el
   * `jsonb_populate_recordset` la traeria a NULL y la columna se quedaria sin
   * valor, porque en la sentencia de app_state la revision se pone a mano
   * (v_nueva) y no desde el payload. Mandarla seria escribir un dato que la
   * funcion va a pisar dos lineas despues.
   */
  function appStateRpc(state) {
    const fila = filaAppState(state, null);
    delete fila.revision;
    return fila;
  }

  /**
   * Cuantos eventos caben en ESTE guardado, y cuales. Solo los que NO estan ya
   * escritos: son los unicos que hay que escribir de verdad, y meter los otros en el
   * cuerpo solo lo hace mas grande, porque la funcion los ignora con on conflict do
   * nothing. El corte se come, por tanto, lo pendiente y no lo que ya esta, y lo que
   * no cabe sale en el siguiente guardado en vez de perderse.
   *
   * "YA ESCRITO" INCLUYE LA BASE, no solo esta pagina. Eso lo garantiza
   * asegurarEventosSembrados, que se llama antes de armar el payload: siembra
   * `eventosEnviados` con los ids que ya trae `operation_events` para las OTs del plan.
   * Sin esa siembra, recargar volvia a mandar los mismos primeros 400 de ~6.300 y los
   * demas solo salian guardando muchas veces en la misma sesion (RULE-SUP-076).
   */
  function repartoDeEventos(filas) {
    const nuevos = (Array.isArray(filas) ? filas : []).filter((fila) => !eventosEnviados.has(fila.id));
    const elegidas = nuevos.slice(0, MAX_EVENTOS_POR_GUARDADO);
    return { filas: elegidas, omitidos: nuevos.length - elegidas.length };
  }

  /** Las OTs distintas que tienen operaciones en el plan, en el orden en que aparecen. */
  function otsConEventos(state) {
    const ots = [];
    const vistas = new Set();
    (Array.isArray(state && state.operations) ? state.operations : []).forEach((op) => {
      if (!op || typeof op !== "object") return;
      const ot = texto(op.ot);
      if (!ot || vistas.has(ot)) return;
      vistas.add(ot);
      ots.push(ot);
    });
    return ots;
  }

  /**
   * Pregunta a la base que eventos del plan YA estan escritos y los marca en
   * `eventosEnviados`. Ver RULE-SUP-076.
   *
   * POR QUE UNA LECTURA Y NO UNA PROMESA DE "YA SE MANDARON". El id del evento es
   * determinista, pero la pagina no recuerda entre recargas que ids mando: ese recuerdo
   * solo tiene sentido si se lee de la base, que es la unica que sabe. La lectura la hace
   * el LECTOR (PPSupabaseReader.readEventIds, filtrada por las OTs del plan), no este
   * modulo: hay un solo lector (RULE-SUP-015/074) y aqui solo se consume.
   *
   * ES BEST-EFFORT, Y SE DICE. Si no hay lector (build sin el, o pruebas) o el estado
   * todavia no trae OTs, no se siembra y no se marca nada: el siguiente guardado lo
   * intenta. Si la lectura falla, el guardado SIGUE (no se cae por no poder optimizar) y
   * el informe lleva el aviso: sin la siembra, este guardado vuelve a mandar sus eventos,
   * que la funcion deduplica por id, asi que no se pierde nada; lo que puede contar de
   * mas es el aviso de "eventos omitidos".
   *
   * SE SIEMBRA UNA VEZ POR SESION. Reintentar la lectura en cada guardado pagaria una
   * lectura por guardado para ahorrar unas escrituras; una vez basta, porque los eventos
   * que salen despues se anaden al mismo conjunto (guardar, camino RPC).
   */
  async function asegurarEventosSembrados(ctx, state, informe) {
    if (eventosSembrados) return;
    const reader = root.PPSupabaseReader;
    if (!reader || typeof reader.readEventIds !== "function") return;
    const ots = otsConEventos(state);
    // Sin OTs no hay nada que preguntar, y NO se marca la sesion como sembrada: un guardado
    // de arranque todavia sin plan no puede cerrarle la puerta al que si lo trae.
    if (!ots.length) return;
    let arrancada = false;
    if (!siembraEnCurso) {
      siembraEnCurso = Promise.resolve().then(() => reader.readEventIds(ots)).then((ids) => {
        (Array.isArray(ids) ? ids : []).forEach((id) => {
          const valor = texto(id);
          if (valor) eventosEnviados.add(valor);
        });
      });
      arrancada = true;
    }
    try {
      await siembraEnCurso;
    } catch (error) {
      if (arrancada) {
        informe.avisos.push(
          "no se pudo comprobar que eventos del log ya estaban en la base, asi que este guardado vuelve a " +
          "mandar los suyos: el id es el mismo y la funcion no los duplica, no se pierde nada, pero el aviso " +
          "de 'eventos omitidos' puede contar de mas. Detalle: " + sano((error && error.message) || error, ctx.secretos)
        );
      }
    } finally {
      if (arrancada) {
        eventosSembrados = true;
        siembraEnCurso = null;
      }
    }
  }

  function filasSnapshots(lista) {
    const filas = [];
    const vistas = new Set();
    (Array.isArray(lista) ? lista : []).forEach((s) => {
      if (!s || typeof s !== "object") return;
      // snapshot_id es NOT NULL UNIQUE ('draft' o un uuid).
      const snapshotId = texto(s.snapshotId || s.snapshot_id);
      if (!snapshotId || vistas.has(snapshotId)) return;
      vistas.add(snapshotId);
      filas.push({
        snapshot_id: snapshotId,
        operations: Array.isArray(s.operations) ? s.operations : [],
        generated_at: instante(s.generatedAt, ""),
        plan_start: texto(s.planStart),
        version: texto(s.version),
        usuario: texto(s.usuario),
        change_summary: jsonb(s.changeSummary, null),
        published_at: instante(s.publishedAt, ""),
        publication_reason: texto(s.publicationReason),
      });
    });
    return filas;
  }

  /**
   * plan_snapshots para plan_guardar, que es OTRO contrato y no una copia del de
   * arriba. La funcion inserta solo tres columnas: snapshot_id, payload y
   * created_at (docs/schema-supabase-plan.sql:688), con el snapshot entero dentro
   * de la columna jsonb `payload`. Por eso el objeto de la pagina va tal cual: la
   * forma de un borrador la decide la app y la funcion no la toca, y separarla en
   * columnas seria escribir un DDL nuevo cada vez que el borrador tenga un campo
   * mas.
   *
   * created_at se manda con el instante del snapshot para que recargar la pagina
   * no cambie la hora de un borrador ya guardado, y con null cuando no hay ninguna
   * fecha, que es lo que la funcion convierte en now().
   */
  function filasSnapshotsRpc(lista) {
    const filas = [];
    const vistas = new Set();
    (Array.isArray(lista) ? lista : []).forEach((s) => {
      if (!s || typeof s !== "object") return;
      const snapshotId = texto(s.snapshotId || s.snapshot_id);
      if (!snapshotId || vistas.has(snapshotId)) return;
      vistas.add(snapshotId);
      filas.push({
        snapshot_id: snapshotId,
        payload: s,
        created_at: instante(s.generatedAt || s.publishedAt || s.createdAt, ""),
      });
    });
    return filas;
  }

  /**
   * El log de cada operacion, partido en eventos. `kind` es el primer token
   * ("MAQUINA_OT_APP", "CAMBIO_HERR_KIT", ...), que es justo por donde se filtra
   * la vista de debug (docs/schema-supabase-plan.sql:95-104). El resto del evento
   * va en payload jsonb, porque su forma la decide la app.
   */
  function filasEventos(state, actor) {
    const filas = [];
    const vistas = new Set();
    (Array.isArray(state.operations) ? state.operations : []).forEach((op) => {
      if (!op || typeof op !== "object") return;
      const operationId = texto(op.id);
      if (!operationId) return;
      const crudo = texto(op.log);
      if (!crudo) return;
      crudo.split(SEPARADOR_LOG).forEach((mensaje, indice) => {
        const entrada = texto(mensaje);
        if (!entrada) return;
        const kind = (entrada.split(" ")[0] || "LOG").toUpperCase();
        const id = uuidDe(operationId + "|" + kind + "|" + indice + "|" + entrada);
        if (vistas.has(id)) return;
        vistas.add(id);
        filas.push({
          id: id,
          operation_id: operationId,
          ot: texto(op.ot),
          secuencia: Math.round(numero(op.secuencia, 0)),
          ct: texto(op.ct),
          kind: kind,
          actor: actor,
          payload: {
            mensaje: entrada,
            operador: texto(op.operador),
            maquina: texto(op.maquina),
            herramental: texto(op.herramental),
            kit: texto(op.kitHerramental),
            fecha_inicio: texto(op.fechaInicio),
            hora_inicio: texto(op.horaInicio),
            fecha_fin: texto(op.fechaFin),
            hora_fin: texto(op.horaFin),
          },
        });
      });
    });
    return filas;
  }

  /**
   * El `actor` de un evento es el auth.uid() de quien hizo el cambio cuando la
   * escritura viene del navegador con sesion (docs/schema-supabase-plan.sql:100-
   * 104). Se saca del `sub` del JWT, que es el identificador PUBLICO del usuario
   * dentro del token; el token entero no se copia, se imprime ni se guarda en
   * ningun sitio. Si no se puede leer, se escribe "web": es mejor un actor
   * generico que perder la trazabilidad.
   */
  function actorDe(token) {
    try {
      const partes = String(token || "").split(".");
      if (partes.length < 2 || typeof root.atob !== "function") return "web";
      let base64 = partes[1].replace(/-/g, "+").replace(/_/g, "/");
      while (base64.length % 4) base64 += "=";
      const cuerpo = JSON.parse(root.atob(base64));
      return texto(cuerpo && cuerpo.sub) || "web";
    } catch { return "web"; }
  }

  /**
   * Los eventos tal como los espera plan_guardar: SIN `actor`.
   *
   * No es que el navegador no sepa quien es: lo sabe, es el mismo auth.uid() que
   * sale del JWT, y va en p_actor. Es que la funcion es la que lo pone en cada
   * fila (docs/schema-supabase-plan.sql:679, `actor` sale de v_actor y no del
   * payload), o sea que mandarlo seria mandar un valor que se pisa. Y como el
   * p_actor lo lee del JWT que ya esta en la cabecera, el dato no sale de aqui.
   */
  function eventosRpc(filas) {
    return (Array.isArray(filas) ? filas : []).map((fila) => ({
      id: fila.id,
      operation_id: fila.operation_id,
      ot: fila.ot,
      ct: fila.ct,
      secuencia: fila.secuencia,
      kind: fila.kind,
      payload: fila.payload,
    }));
  }

  // FNV-1a de 32 bits con cuatro semillas: 128 bits en total, repartidos con el
  // formato de un uuid (8-4-4-4-12) porque la columna `id` de operation_events es
  // uuid. 128 bits hace la collision practicamente nula para el volumen de un log.
  function hash32(entrada, semilla) {
    let h = (2166136261 ^ semilla) >>> 0;
    for (let i = 0; i < entrada.length; i += 1) {
      h = Math.imul(h ^ entrada.charCodeAt(i), 16777619) >>> 0;
    }
    h = Math.imul(h ^ (h >>> 15), 2246822507) >>> 0;
    h = Math.imul(h ^ (h >>> 13), 3266489909) >>> 0;
    return (h ^ (h >>> 16)) >>> 0;
  }

  function uuidDe(entrada) {
    const h = (n) => (n >>> 0).toString(16).padStart(8, "0");
    const p1 = h(hash32(entrada, 0x00000000));
    const p2 = h(hash32(entrada, 0x9e3779b1));
    const p3 = h(hash32(entrada, 0x85ebca6b));
    const p4 = h(hash32(entrada, 0xc2b2ae35));
    return p1 + "-" + p2.slice(0, 4) + "-" + p3.slice(0, 4) + "-" + p4.slice(0, 4) + "-" + p2.slice(4) + p3.slice(4) + p4.slice(4);
  }

  // ---------------------------------------------------------------------------
  // API
  // ---------------------------------------------------------------------------

  function cerrar(informe, t0, ok) {
    // `ok` explicito cuando la decision NO sale de las tablas: el RPC decide
    // dentro de la transaccion, y un conflicto es un ok false con el guardado
    // entero sin escribir, no una tabla con error.
    informe.ok = ok === undefined ? Object.keys(informe.tablas).every((t) => !informe.tablas[t].error) : ok;
    informe.ms = Date.now() - t0;
    return informe;
  }

  function sinEscribir(informe, t0, motivo) {
    // No pasa por cerrar(): alli `ok` se recalcula sobre las tablas, y un informe
    // sin tablas saldria en verde, que es justo lo que no paso.
    informe.ok = false;
    informe.motivo = motivo;
    informe.ms = Date.now() - t0;
    return informe;
  }

  /**
   * EL PAYLOAD DE plan_guardar: el estado mapeado, con las tablas de Supabase
   * como claves de primer nivel. Siempre las nueve, aunque alguna vaya vacia: la
   * funcion lee `p_payload -> 'tabla'`, y una clave que no esta llega como NULL,
   * que no es lo mismo que una lista vacia.
   */
  function armarPayload(state, revision, opciones) {
    const opts = opciones || {};
    const eventos = repartoDeEventos(eventosRpc(filasEventos(state, null)));
    return {
      payload: {
        operations: filasOperations(state, revision),
        work_orders: filasWorkOrders(state, revision),
        materials: filasMaterials(state, revision),
        selected_ots: filasSelectedOts(state),
        locked_ots: filasLockedOts(state),
        operation_plan_statuses: filasPlanStatuses(state, revision),
        operation_events: eventos.filas,
        plan_snapshots: filasSnapshotsRpc(opts.snapshots),
        app_state: appStateRpc(state),
      },
      eventos: eventos.filas,
      eventosOmitidos: eventos.omitidos,
    };
  }

  /**
   * Se puede llamar a la funcion con este estado?
   *
   * El freno se mira el payload YA MAPEADO y no el estado en crudo, y no es
   * purismo: el mapa descarta filas sin clave natural (una OT sin ot, un estado sin
   * key). Una lista cruda con una fila inservible llegaria "con datos" al freno y
   * vaciaria igual, que es justo lo que el freno evita.
   *
   * Las tres del ERP no se miran: en la funcion son modo `actualiza` (UPDATE y
   * nada mas), asi que una lista vacia ahi no toca una sola fila.
   *
   * locked_ots tampoco se vigila (fix 2026-10-07, RULE-SUP-064): es espejo del
   * estado y su vacio es legitimo cuando no hay OTs bloqueadas. Si la lectura se
   * cayo, selected_ots y operation_plan_statuses llegan vacias en la misma
   * pasada y el freno salta por ellas: la proteccion del plan entero no depende
   * de locked_ots.
   */
  function frenoDelRpc(payload, opciones) {
    if ((opciones || {}).vaciarSiEstaVacio === true) return null;
    const vacias = [];
    ESPEJO_QUE_SE_VACIA.forEach((tabla) => {
      if (!Array.isArray(payload[tabla]) || !payload[tabla].length) vacias.push(tabla);
    });
    if (!vacias.length) return null;
    return "llego vacia y sin que nadie lo pidiera con vaciarSiEstaVacio: " + vacias.join(", ");
  }

  /**
   * UNA SOLA PETICION, la que decide. Nunca llama a public.ingesta_mirror: ese RPC
   * borra la tabla que le digan y sigue revocado para el navegador (ver la
   * cabecera). Lo unico que se llama es plan_guardar, que no borra nada del ERP y
   * compara la revision dentro de la transaccion.
   *
   * Devuelve {estado, ...} y el `estado` es lo que decide el camino:
   *   ok        la funcion escribio y devolvio el informe.
   *   conflicto la revision no era la que traiamos. NO se escribio nada.
