   * la manda), asi que el orden es el que vino, y el estado no lo usa: lo que importa
   * es el conjunto.
   */
  function mapLockedOts(rows) {
    const out = [];
    const vistas = {};
    (rows || []).forEach(function (row) {
      const ot = String(row.ot == null ? "" : row.ot).trim();
      if (!ot || vistas[ot]) return;
      vistas[ot] = true;
      out.push(ot);
    });
    return out;
  }

  /**
   * operation_plan_statuses -> el OBJETO indexado por clave que espera
   * normalizeOperationPlanStatuses (app.js:1739). Los nombres de campo del estado son
   * `sequence`, `completedAt` y `reopenedAt`; los de la tabla son `secuencia`,
   * `fecha_completado` y `fecha_reapertura`. `origin` se conserva tal cual, con su
   * default del escritor ("draft"), porque es lo que decide si la fila pertenece al
   * borrador o a un plan publicado (statusesForPlanOrigin, app.js:1955).
   *
   * `type` NO se inventa: la tabla no lo tiene y el estado lo normaliza a "OPERATION"
   * cuando no viene (app.js:1747). Mandar un "TOOL_CHANGE" aqui seria afirmar que se
   * sabe el tipo cuando la columna no lo guardo.
   */
  function mapPlanStatuses(rows) {
    const out = {};
    (rows || []).forEach(function (row) {
      const key = String(row.key == null ? "" : row.key).trim();
      if (!key || out[key]) return;
      out[key] = {
        key: key,
        ot: String(row.ot == null ? "" : row.ot).trim(),
        sequence: number(row.secuencia),
        ct: String(row.ct == null ? "" : row.ct).trim(),
        status: String(row.status == null ? "PENDIENTE" : row.status).trim() || "PENDIENTE",
        origin: String(row.origin == null ? "draft" : row.origin).trim() || "draft",
        completedAt: String(row.fecha_completado == null ? "" : row.fecha_completado).trim(),
        reopenedAt: String(row.fecha_reapertura == null ? "" : row.fecha_reapertura).trim(),
      };
    });
    return out;
  }

  /**
   * app_state: la fila UNICA (id = 1, con check), y la ventana del plan con los ajustes.
   * Devuelve null si no hay fila: es lo que la pagina写入 la primera vez, y "no hay
   * fila" no es lo mismo que "hay una fila con todo vacio". Quien la aplique decide
   * con eso, y no se inventa un estado de muestra.
   *
   * `last_schedule` es jsonb y ya llega como objeto; `settings`, `plant` y
   * `report_filters` tambien. Se normalizan igual (jsonb()) para que el estado no
   * cambie de forma segun si el dato venia de Postgres o de las Hojas, donde era
   * texto.
   */
  function mapAppState(rows) {
    const fila = (rows || [])[0];
    if (!fila) return null;
    return {
      revision: number(fila.revision),
      savedAt: String(fila.saved_at == null ? "" : fila.saved_at).trim(),
      syncedAt: String(fila.synced_at == null ? "" : fila.synced_at).trim(),
      planStart: String(fila.plan_start == null ? "" : fila.plan_start).trim(),
      horizonDays: fila.horizon_days == null || fila.horizon_days === "" ? null : number(fila.horizon_days),
      reportWeekStart: String(fila.report_week_start == null ? "" : fila.report_week_start).trim(),
      reportFilters: objeto(fila.report_filters, {}),
      settings: objeto(fila.settings, {}),
      plant: objeto(fila.plant, {}),
      operationCatalogWarning: String(fila.operation_catalog_warning == null ? "" : fila.operation_catalog_warning).trim(),
      lastSchedule: objeto(fila.last_schedule, null),
      // RULE-OT-057: firma "ya preparado" por OT. Sin leerla, el registro de OTs ya
      // confirmadas se perdia en cada carga y el dialogo de preparacion volvia a abrirse.
      preparedPlanningByOt: objeto(fila.prepared_planning_by_ot, {}),
    };
  }

  /** jsonb que puede venir como objeto o como texto (asi lo guardaba la Hoja). */
  function objeto(valor, porDefecto) {
    if (valor === null || valor === undefined) return porDefecto;
    if (typeof valor === "object") return valor;
    const texto = String(valor).trim();
    if (!texto) return porDefecto;
    try { return JSON.parse(texto); } catch (error) { return porDefecto; }
  }

  function mapMaterials(rows) {
    return (rows || []).map(function (row) {
      return {
        id: row.id, ot: row.ot, workOrderId: row.wo_internal_id, assembly: row.ensamble,
        componentId: row.componente_id, component: row.componente, description: row.descripcion,
        unit: row.unidad, required: number(row.requerido), issued: number(row.emitido),
        pending: number(row.pendiente),
        // MEDIDO 2026-10-04: `lineId` es la clave natural de la fila y la pagina la
        // necesita para poder GUARDAR sin crear una fila nueva por cada guardado. `line_id`
        // lo escribe la ingesta (RESTlet 2246) con el id de renglon de NetSuite (`comp.id`),
        // y con el UNIQUE (ot, line_id) es la unica clave con la que un UPSERT actualiza la
        // fila del ERP en vez de insertar una copia. Sin exponerla, `filasMaterials`
        // (supabase-writer.js) no tiene mas que `id`, que es el UUID de la fila, y escribia
        // ESO como `line_id`: medido 348 (ot, componente) con dos filas cada uno (697 filas
        // para 348 materiales) y una MP saliendo dos veces en la hoja de inspeccion. Se
        // escribe aqui, no en el escritor, porque el escritor no tiene la fila cruda.
        lineId: String(row.line_id == null ? "" : row.line_id).trim(),
      };
    });
  }

  function mapWorkOrders(rows) {
    // Mapeo parcial a proposito: dueDateOverride y averageSalePriceFrom/To NO existen en la tabla
    // (MAPPING_GAPS.work_orders). Se dejan vacios en vez de inventarlos.
    return (rows || []).map(function (row) {
      const quantity = number(row.cantidad);
      const builtQuantity = number(row.cant_ensamblada);
      const pendienteEscrito = number(row.cant_pendiente);
      // MEDIDO 2026-10-01 en la pagina real, con sesion: las 175 OT del Backlog decían `qty:0`
      // y las 10 de la cola igual, mientras el detalle de la OT sí enseña la cantidad. La
      // cadena, y cada paso la conserva:
      //
      //   1. `work_orders.cant_pendiente` y `cant_ensamblada` son `integer not null default 0`.
      //   2. MEDIDO: `cant_pendiente` y `cant_ensamblada` NO aparecen en NINGUN archivo de
      //      `src/server/`, o sea que la ingesta (que hace mirror de las filas del RESTlet tal
      //      cual) no las escribe. El unico escritor de la pagina (filasWorkOrders,
      //      supabase-writer.js:1290-1291) escribe lo que viene del estado, o sea un 0.
      //
      //      CORREGIDO EL 2026-10-25, Y ESTO ES LO QUE CIERRA EL HUECO. El 2246 ya emite las
      //      dos columnas (`netsuite-restlet-unificado-supabase.js`, `enriquecerEnsamblada_`):
      //      la ensamblada es la `completedquantity` de la ULTIMA operacion de la OT, que es el
      //      mismo dato que `record:built` del 2244 (medido en vivo en 60 de 60 OTs: 3764 = 10,
      //      3789 = 5, 3786 = 0, 3338 = 55 de 50). Desde esa corrida de la ingesta,
      //      `cant_ensamblada` deja de ser 0 en las 491 filas y el pendiente escrito ya se puede
      //      creer. La regla de abajo NO se toca: sigue siendo la que distingue "nadie escribio"
      //      de "un 0 de verdad", y es la que cubre a las filas que quedaron del espejo viejo o a
      //      una corrida sin la consulta nueva.
      //   3. Antes esta linea decia: `rawPending === "" ? cantidad - cant_ensamblada : ...`.
      //      Con `not null default 0` la columna NUNCA llega vacia, asi que esa rama era CODIGO
      //      MUERTO y el `else` ganaba siempre: pendingQuantity era 0 para todas.
      //   4. Abajo, normalizeWorkOrders (app.js:1805) tiene el respaldo
      //      `pendingQuantity ?? cantidad - ensamblada`, pero `??` solo cae en `null`/`undefined`,
      //      no en 0. Un 0 lo bloquea igual que antes.
      //   5. Y pendingPiecesForWorkOrder (app.js:13098) lo acepta porque
      //      `Number.isFinite(Number(0))` es true.
      //
      // QUE HACE ESTA LINEA Y POR QUE NO ADIVINA. Un pendiente de 0 solo se cree cuando hay un
      // pendiente escrito Y una ensamblada escrita: si assembled=0 y pending=0 juntos, lo unico
      // que se sabe con certeza es que nadie ha escrito ninguna de las dos, y entonces la
      // cantidad pendiente es la cantidad de la orden. `cantidad - cant_ensamblada` es la regla
      // que el propio lector ya declaraba; lo que cambio es que por fin se puede aplicar, y con
      // los datos de hoy sale `cantidad` porque ensamblada viene 0.
      //
      // Y SI HAY UN 0 DE VERDAD. Una OT completamente surtida tiene pending=0 con
      // ensamblada=cantidad, o con ensamblada>0, y ahi el 0 se respeta: la rama de arriba solo
      // se salta cuando las dos columnas son 0 a la vez. La consecuencia de equivocarse en este
      // punto es una OT ya cerrada presenteada como pendiente, que es lo que se revisa a mano;
      // la de antes era una OT de 500 piezas presenteada como 0, que es lo que se revisaba solo.
      //
      // DECIDIDO, no deducido: el hueco de `cant_ensamblada`/`cant_pendiente` se declara en
      // MAPPING_GAPS.work_orders para que quede a la vista en vez de quedar absorbido aqui.
      // Las tres fechas usan la MISMA regla simetrica que las de operations: sin convertir de
      // zona. MEDIDO 2026-09-29: fecha_inicio_ns y fecha_fin_ns NULAS en 212/212, o sea que
      // solo llega fecha_vencimiento, y llega como fecha sin hora.
      //
      // LA HORA DE ESTAS TRES NO TIENE DONDE IR, Y SE DICE. PP_mapWorkOrder_
      // (02-storage.js:2179) deja startDate, endDate y dueDate como un solo campo de texto
      // cada uno: no hay startTime ni endTime en el estado de una orden. Se mapea la fecha y
      // la hora se descarta, en vez de inventar un campo que el estado no tiene. Con los datos
      // medidos no se pierde nada (las tres columnas son nulas o son medianoche); si alguna
      // vez llegara con hora, la decision de donde guardarla es de quien mantenga el shape del
      // estado, no de este lector.
      const inicio = partirFechaTexto(row.fecha_inicio_ns);
      const fin = partirFechaTexto(row.fecha_fin_ns);
      const vencimiento = partirFechaTexto(row.fecha_vencimiento);
      return {
        id: row.id, workOrderId: row.wo_internal_id, ot: row.ot, item: row.articulo,
        description: row.descripcion, photoUrl: row.foto_url, startDate: inicio.fecha,
        endDate: fin.fecha, dueDate: vencimiento.fecha, dueDateOverride: "",
        quantity: quantity, status: row.estatus, customer: row.cliente, builtQuantity: builtQuantity,
        // Si la OT esta cerrada, segun el ESTATUS de NetSuite. No es un dato de la OT: es la
        // respuesta a la pregunta "¿esta cerrada?" que hacen confirmWorkOrderClosures y la
        // lista de inspeccion. Se calcula aqui, con el UNICO predicado (workOrderCerrada), y
        // viaja con la fila para que cada consumidor decida en vez de recalcularlo con su
        // propia lista de palabras. MEDIDO 2026-10-05: ver el comentario de PALABRAS_OT_CERRADA.
        cerrada: workOrderCerrada(row.estatus),
        // Ver el comentario de `pendienteEscrito` arriba. En resumen: un 0 que no viene
        // acompañado de avance no es evidencia de que no quede nada, y por eso la cantidad de la
        // orden gana. Un 0 de verdad se respeta, y se distingue porque en ese caso
        // cant_ensamblada trae el avance (el `|| cantidad` solo cubre la OT sin cantidad, donde
        // el pendiente escrito es el unico dato que hay).
        pendingQuantity: (pendienteEscrito > 0 || builtQuantity > 0)
          ? Math.max(0, pendienteEscrito)
          : Math.max(0, quantity),
        averageSalePrice: number(row.precio_promedio_venta), averageSalePriceFrom: "", averageSalePriceTo: "",
        lastSalePrice: number(row.precio_ultima_venta),
        // `revision` NO es la revision del BOM. MEDIDO 2026-10-01: la columna existe
        // pero `filasWorkOrders` (supabase-writer.js:1645) escribe ahi la REVISION DEL
        // PLAN, un contador de guardado. La hoja de inspeccion pinta esta celda en un
        // cuadrito rotulado REV y quiere la revision del BOM de NetSuite. Se deja ""
        // y no se copia `row.revision`: un numero de guardado en una celda de revision
        // de ingenieria es peor que una celda vacia. Ver MAPPING_GAPS.work_orders.
        revision: "",
      };
    });
  }

  /**
   * unconfirmed_work_orders -> el objeto de marcas por folio que el estado espera
   * (`state.unconfirmedWorkOrders`), que consume mergeUnconfirmedWorkOrderMarks en app.js.
   *
   * LA CLAVE ES EL FOLIO y no el id de la fila, porque la marca se identifica por OT: el id es
   * un uuid que el estado nunca vio. Se devuelve un OBJETEO (no una lista) para que
   * applyImported la pueda unir con las marcas locales sin mas trabajo.
   */
  function mapUnconfirmedWorkOrders(rows) {
    const marcas = {};
    (rows || []).forEach(function (row) {
      const ot = String(row.ot == null ? "" : row.ot).trim();
      if (!ot) return;
      marcas[ot] = {
        ot: ot,
        firstSeenAt: String(row.first_seen_at == null ? "" : row.first_seen_at),
        lastSeenAt: String(row.last_seen_at == null ? "" : row.last_seen_at),
        misses: Math.max(1, Math.round(number(row.misses))),
      };
    });
    return marcas;
  }

  /**
   * closed_work_order_summaries -> `state.closedWorkOrderSummaries`, tambien por folio.
   * La columna `summary` es jsonb y guarda lo que la pagina ya escribio, asi que se devuelve
   * tal cual; si viniera como texto (la columna lo permite en otras tablas), se parsea.
   */
  function mapClosedWorkOrderSummaries(rows) {
    const resumenes = {};
    (rows || []).forEach(function (row) {
      const ot = String(row.ot == null ? "" : row.ot).trim();
      if (!ot) return;
      const contenido = objeto(row.summary, null);
      if (!contenido || typeof contenido !== "object") return;
      resumenes[ot] = Object.assign({}, contenido, { ot: contenido.ot || ot });
    });
    return resumenes;
  }

  // UNA TABLA QUE NO SE PUDO LEER NO ES UNA TABLA VACIA. Son dos hechos distintos y el que los
  // confundia perdia datos: si la lectura falla, la rebanada vuelve como undefined, que
  // supabase-catalog-apply.js descarta a proposito (undefined = 'el lector no trajo esto'), y
  // lo que el puente si habia traido se queda. Si la lectura sale bien y la tabla esta vacia,
  // la rebanada vuelve vacia de verdad ([] o {}), que si se aplica porque significa 'no hay'.
  function siSePudoLeer(rows, table, valor) {
    return rows[table] == null ? undefined : valor;
  }

  // LEE LOS CATALOGOS y devuelve las rebanadas del estado que HOY se pueden llenar de Supabase, mas
  // missing (tablas vacias/ausentes) y gaps (campos que no se pueden llenar). Nunca lanza por una
  // tabla caida: la reporta en errors para que el llamador decida el fallback.

  // LAS TABLAS QUE SE LEEN PAGINADAS, con el orden estable que la paginacion exige.
  //
  // MEDIDO 2026-10-05 con el conteo exacto de Supabase: de las 24 tablas que lee
  // `readCatalogs`, solo `operations` (2275 filas) REBASA `db-max-rows` (1000). La que mas filas
  // tiene despues es `materials`, con 349, y las otras 22 andan de 0 a 213. `inspection_routes`
  // (2006 filas) tambien lo rebasa, pero no entra aqui: se lee suelta y ya pagina a mano
  // (`readInspectionRoutes`, linea ~700). Paginarlas todas seria gastar peticiones sin ganar
  // nada. CUANDO ALGUNA CREZCA DE 1000 HAY QUE AGREGARLA AQUI: tocar el limite no sirve,
  // porque el corte es de PostgREST y llega como HTTP 200 sin aviso.
  //
  // `operations` se ordena por `ot` y `secuencia` (no por `id`): es el orden en que el plan se
  // presenta y el que la pagina ya usa al agrupar (`sequenceSort`). Mapear y agrupar son
  // insensibles al orden de las filas, asi que esto no cambia lo que se ve; lo que evita es que
  // el `offset` de la segunda vuelta se coma operaciones del principio.
  const ORDEN_PAGINADO = { operations: "ot.asc,secuencia.asc" };

  // LA TABLA DE LA QUE SALE CADA REBANADA DE `catalogs`. La clave de la rebanada NO es el
  // nombre de la tabla (`toolCatalog` es `tools`, `otTypes` es `ot_types`, `machines` es
  // `machine_catalog`...), y varias rebanadas salen de la MISMA tabla (las cuatro de
  // operador, todas de `operators`). Lo pide el sondeo de antiguedad de
  // supabase-catalog-boot.js: MEDIDO 2026-10-11, ese sondeo pasaba las claves de `catalogs`
  // como nombres de tabla y PostgREST devolvia 404 para ~17 de las 20 (operatorCapacity,
  // hiddenCapabilities, cts...), de modo que el aviso de "Datos viejos" no veia esos
  // catalogos. Ver RULE-SUP-074.
  const FUENTES_DE_CATALOGO = {
    operators: "operators",
    operatorCapacity: "operators",
    operatorPerformance: "operators",
    operatorProfiles: "operators",
    configuredCapabilities: "capabilities",
    hiddenCapabilities: "capabilities",
    capacityModes: "capabilities",
    operationRules: "capabilities",
    customCapabilities: "capabilities",
    cts: "capabilities",
    operationCatalog: "operation_catalog",
    matrix: "matrix",
    matrixFull: "matrix",
    machines: "machine_catalog",
    otTypes: "ot_types",
    subcontracts: "subcontracts",
    toolCatalog: "tools",
    calendarExceptions: "calendar_exceptions",
    otConfigurations: "ot_configurations",
    articleConfigurations: "article_configurations",
    machinePlanningOverrides: "machine_planning_overrides",
  };

  async function readCatalogs(options) {
    const opts = options || {};
    // Las de persona van SIEMPRE, sin opcion para dejarlas fuera: sin ellas la pagina
    // arranca con la cola vacia y sin el historial de completar/reabrir, que es
    // perder el estado de la persona, no un detalle de arranque. Ver PERSON_TABLES.
    const tables = (opts.tables || READ_TABLES).concat(PERSON_TABLES.filter(function (t) {
      return (opts.tables || READ_TABLES).indexOf(t) < 0;
    }));
    const rows = {};
    const errors = {};
    await Promise.all(tables.map(async function (table) {
      try {
        rows[table] = ORDEN_PAGINADO[table]
          ? await readTableEntero(table, { order: ORDEN_PAGINADO[table] })
          : await readTableConReintentos(table);
      } catch (error) {
        rows[table] = null;
        errors[table] = String((error && error.message) || error);
      }
    }));

    const missing = [];
    tables.forEach(function (table) {
      if (!rows[table] || rows[table].length === 0) missing.push(table);
    });

    const operatorSlice = mapOperators(rows.operators);
    const capabilitySlice = mapCapabilities(rows.capabilities);
    const cts = capabilitySlice.cts.slice();
    (rows.operations || []).forEach(function (op) {
      const ct = String(op.ct == null ? "" : op.ct).trim();
      if (ct && cts.indexOf(ct) < 0) cts.push(ct);
    });

    const catalogs = {
      operators: siSePudoLeer(rows, "operators", operatorSlice.operators),
      operatorCapacity: siSePudoLeer(rows, "operators", operatorSlice.operatorCapacity),
      operatorPerformance: siSePudoLeer(rows, "operators", operatorSlice.operatorPerformance),
      operatorProfiles: siSePudoLeer(rows, "operators", operatorSlice.operatorProfiles),
      configuredCapabilities: siSePudoLeer(rows, "capabilities", capabilitySlice.configuredCapabilities),
      hiddenCapabilities: siSePudoLeer(rows, "capabilities", capabilitySlice.hiddenCapabilities),
      capacityModes: siSePudoLeer(rows, "capabilities", capabilitySlice.capacityModes),
      operationRules: siSePudoLeer(rows, "capabilities", capabilitySlice.operationRules),
      customCapabilities: siSePudoLeer(rows, "capabilities", capabilitySlice.customCapabilities),
      // cts es la union de las de capabilities y las de operations, asi que se cuelga de
      // capabilities: si esa tabla cayo, la union esta a medias y publicarla seria quitar CTs
      // que si existen. Es mejor que se quede la del puente.
      cts: siSePudoLeer(rows, "capabilities", cts),
      operationCatalog: siSePudoLeer(rows, "operation_catalog", mapOperationCatalog(rows.operation_catalog)),
      matrix: siSePudoLeer(rows, "matrix", mapMatrix(rows.matrix)),
    // La rejilla completa, marcada y sin marcar. Para la vista de la matriz; el planificador
    // sigue leyendo matrix, que solo trae los habilitados.
    matrixFull: siSePudoLeer(rows, "matrix", mapMatrixFull(rows.matrix)),
      // MEDIDO 2026-10-01, DECISION DEL USUARIO: el catalogo de maquinas sale de
      // `machine_catalog` (manual, la pagina lo escribe), no de `machines` (ingesta de
      // NetSuite). `machines` sigue existiendo y el RESTlet 2246 sigue escribiendola,
      // pero ya no alimenta el catalogo que ve la pagina. Ver docs/schema-machine-catalog.sql.
      machines: siSePudoLeer(rows, "machine_catalog", mapMachines(rows.machine_catalog, rows.machine_planning_overrides)),
      otTypes: siSePudoLeer(rows, "ot_types", mapOtTypes(rows.ot_types)),
      subcontracts: siSePudoLeer(rows, "subcontracts", mapSubcontracts(rows.subcontracts)),
      // Estas cuatro ya se PIDIAN y se leian (estan en CATALOG_TABLES) pero se descartaban
      // enteras: la pagina se quedaba sin herramientas, sin calendario, sin configuracion
      // por OT y sin precio de venta por articulo aunque las filas estuvieran ahi.
      toolCatalog: siSePudoLeer(rows, "tools", mapTools(rows.tools)),
      calendarExceptions: siSePudoLeer(rows, "calendar_exceptions", mapCalendar(rows.calendar_exceptions)),
      otConfigurations: siSePudoLeer(rows, "ot_configurations", mapOtConfigurations(rows.ot_configurations)),
      articleConfigurations: siSePudoLeer(rows, "article_configurations", mapArticleConfigurations(rows.article_configurations)),
      // machine_planning_overrides ya se usa para calcular `machines.active/excluded`
      // (mapMachines recibe overrides). Se devuelve también mapeado para que el boot tenga
      // TODOS los catálogos normalizados (no filas crudas), aunque la app no lo consuma directo.
      machinePlanningOverrides: siSePudoLeer(rows, "machine_planning_overrides", mapMachinePlanningOverrides(rows.machine_planning_overrides)),
    };
    // undefined no se devuelve: supabase-catalog-apply.js lo descarta a proposito, y es lo
    // unico que NO pisa lo que el puente si trajo. Ver siSePudoLeer.
    Object.keys(catalogs).forEach(function (clave) {
      if (catalogs[clave] === undefined) delete catalogs[clave];
    });

    return {
      source: "supabase",
      schemaVersion: "supabase-reader/1",
      catalogs: catalogs,
      // La tabla de la que sale cada rebanada de `catalogs`. Lo usa el sondeo de antiguedad
      // del arranque para consultar la tabla real y no la clave del estado. Ver RULE-SUP-074.
      fuentes: FUENTES_DE_CATALOGO,
      // LAS CUATRO DE PERSONA, con el mismo criterio que las rebanadas: undefined es
      // 'el lector no trajo esto' (la tabla cayo) y un valor, aunque vacio, es 'no
      // hay'. selectedOts/lockedOts son listas de OT y operationPlanStatuses el objeto
      // por clave; appState es la fila unica o null si todavia no existe ninguna.
      selectedOts: siSePudoLeer(rows, "selected_ots", mapSelectedOts(rows.selected_ots)),
      lockedOts: siSePudoLeer(rows, "locked_ots", mapLockedOts(rows.locked_ots)),
      operationPlanStatuses: siSePudoLeer(rows, "operation_plan_statuses", mapPlanStatuses(rows.operation_plan_statuses)),
      appState: siSePudoLeer(rows, "app_state", mapAppState(rows.app_state)),
      // Las marcas de OT y el resumen de las OTs cerradas (DECIDIDO 2026-09-30, con el sync
      // escribiendo a Supabase). Los dos con el criterio de las de arriba: undefined si la
      // tabla no se pudo leer, {} de verdad si se leyo vacia.
      unconfirmedWorkOrders: siSePudoLeer(rows, "unconfirmed_work_orders", mapUnconfirmedWorkOrders(rows.unconfirmed_work_orders)),
      closedWorkOrderSummaries: siSePudoLeer(rows, "closed_work_order_summaries", mapClosedWorkOrderSummaries(rows.closed_work_order_summaries)),
      // operations: el plan. MEDIDO 2026-09-29: el arranque (supabase-catalog-apply.js)
      // lo mete por aplicarEstadoDesdeSupabase -> applyImported, que es la funcion que
      // reconcilia. Lo que NO se puede representar son las columnas ausentes, y estan
      // en MAPPING_GAPS: leer de aqui deja el plan sin num, parte, contenido,
      // prioridad, fechaReq ni log.
      operations: mapOperations(rows.operations),
      // Solo las ABIERTAS. `work_orders` tambien trae las cerradas recientes (ver
      // soloWorkOrdersAbiertas): el catalogo de OTs del arranque es el conjunto de las que se
      // pueden_planear, y una OT cerrada en esa lista se planaria.
      workOrders: soloWorkOrdersAbiertas(rows.work_orders),
      materials: mapMaterials(rows.materials),
      operationalRaw: {
        operations: rows.operations || null,
        items: rows.items || null,
        inventory: rows.inventory || null,
        sales_orders: rows.sales_orders || null,
      },
      missing: missing,
      errors: errors,
      gaps: MAPPING_GAPS,
    };
  }

  return {
    configure: configure,
    // MEDIDO 2026-09-29: el modulo de arranque (supabase-catalog-boot.js) necesita
    // saber si hay URL y clave, y hasta ahora no habia forma de preguntarselo: solo
    // existia isConfigured(), que responde si/no pero no da los valores. El arranque
    // lo resolvia inventandose un lector.configured() que no existia, con lo que
    //_entero se daba por apagado y no se leia NADA de Supabase. Sin dar, la pantalla
    // de entrada, los catalogos y el aviso de antiguedad dependian de una funcion
    // que no existia.
    config: function () { return { url: config.url, anonKey: config.anonKey }; },
    isConfigured: isConfigured,
    sessionRequired: sessionRequired,
    PERSON_TABLES: PERSON_TABLES,
    readTable: readTable,
    // FIX 2026-10-05: la lectura paginada y el mapa de tablas que la usan se exportan para que las
    // sondas y los tests puedan correrlas contra un `fetch` de mentira que aplique `db-max-rows`.
    readTableEntero: readTableEntero,
    ORDEN_PAGINADO: ORDEN_PAGINADO,
    countTable: countTable,
    // Los ids de operation_events que ya estan en la base para unas OTs. Lo pide el
    // escritor antes de armar el payload, para mandar solo lo que falta. Ver RULE-SUP-076.
    readEventIds: readEventIds,
    status: status,
    readCatalogs: readCatalogs,
    // El mapa rebanada->tabla. Se publica para que el arranque y los tests puedan exigir
    // que cada rebanada tenga su tabla sin duplicar la lista. Ver RULE-SUP-074.
    FUENTES_DE_CATALOGO: FUENTES_DE_CATALOGO,
    normalizeCapabilityKey: normalizeCapabilityKey,
    normalizeKey: normalizeKey,
    // Los mapeos se exportan para que la sonda y los tests los puedan correr sobre filas
    // sueltas, sin levantar una lectura entera. No son la via de la pagina: la pagina
    // consume lo que devuelve readCatalogs.
    mapOperators: mapOperators,
    mapCapabilities: mapCapabilities,
    mapTools: mapTools,
    mapCalendar: mapCalendar,
    mapArticleConfigurations: mapArticleConfigurations,
    mapOtConfigurations: mapOtConfigurations,
    mapOperations: mapOperations,
    mapSubcontracts: mapSubcontracts,
    mapWorkOrders: mapWorkOrders,
    // MEDIDO 2026-10-05: el UNICO predicado de "esta OT cerrada", y las dos que lo usan.
    // Se publica para que `supabase-bridge-replacement.js` NO tenga su propia lista: sus tres
    // preguntas (el catalogo de OTs, la confirmacion de cierres y la lista de la hoja de
    // inspeccion) son la misma pregunta con tres palabras distintas, y con dos listas
    // distintas se contradecirian entre si. Ver PALABRAS_OT_CERRADA mas arriba.
    workOrderCerrada: workOrderCerrada,
    soloWorkOrdersAbiertas: soloWorkOrdersAbiertas,
    // MEDIDO 2026-10-01: esta NO estaba exportada y el reemplazo la pide. mapMaterials existia
    // (esta misma linea 851) y se usaba internamente en readCatalogs (linea ~1039), o sea que
    // estaba escrita, probada por dentro y solo faltaba publicarla. El efecto fue que
    // getPlanningWorkOrderData - el camino de la pagina que trae operaciones, materiales y
    // ficha de UNA OT - tiraba `TypeError: r.mapMaterials is not a function` en cada llamada, y
    // con ella caia TODA la carga por OT: MEDIDO en produccion, el toast de la tarjeta del
    // Backlog decia literalmente "r.mapMaterials is not a function". La funcion de la OT no
    // llegaba nunca desde Supabase. Es la misma clase de fallo que el disparador de updated_at
    // bien puesto y sin leer, y que sessionRequired: la pieza existe y nadie la conecta.
    mapMaterials: mapMaterials,
    mapMachinePlanningOverrides: mapMachinePlanningOverrides,
    // MEDIDO 2026-10-01: el catalogo de tramos de inspeccion. No es parte de

  // con el presupuesto no repita (y no vuelva a pagar) lo que ya esta escrito: el corte
  // avanza de verdad en vez de estarse reenviando lo mismo.
  //
  // OJO CON EL ALCANCE, que es la leccion de RULE-SUP-076 (2026-10-11). Esto NO es solo
  // "lo que salio en esta pagina": antes lo era, y con un plan de ~6.300 eventos el tope
  // de 400 hacia que cada recarga volviera a mandar los MISMOS primeros 400 y que los
  // ~5.900 de arriba solo salieran guardando 16 veces en la MISMA sesion. Ahora, antes de
  // armar el payload, el conjunto se SIEMBRA con los ids que ya tiene la base
  // (asegurarEventosSembrados), asi que "ya enviado" quiere decir "ya esta en la base" y
  // el guardado manda solo lo que falta. Los que se mandan en este guardado se anaden
  // despues, como siempre.
  const eventosEnviados = new Set();

  // Si ya se pregunto a la base por los eventos del plan, y la lectura en curso. Son dos
  // variables y no una para que dos guardados solapados (persistPlanSnapshot hace dos
  // guardados) no disparen dos lecturas: el primero deja la promesa y el segundo la
  // espera. configure() las reinicia: otra URL es otro proyecto y el "ya esta en la base"
  // de antes deja de valer.
  let eventosSembrados = false;
  let siembraEnCurso = null;

  /**
   * El detalle del 404 del RPC, o null mientras no se sepa. En cuanto se sabe que
   * plan_guardar no existe, NO se vuelve a preguntar: la respuesta no va a cambiar
   * mientras la pagina siga abierta, y repreguntar es un gasto que la persona
   * paga en cada guardado. No es memoria del resultado de un guardado, es memoria
   * de una caracteristica de la base, y por eso tiene su propio sitio y no se
   * confunde con no reintentar un 5xx, que si se reintenta. Se reinicia con
   * configure(), que es cuando de verdad puede haber cambiado algo.
   */
  let rpcAusente = null;

  // ---------------------------------------------------------------------------
  // Configuracion
  // ---------------------------------------------------------------------------

  function configure(patch) {
    if (patch && typeof patch === "object") {
      if (patch.url != null) config.url = String(patch.url).replace(/\/+$/, "");
      if (patch.anonKey != null) config.anonKey = String(patch.anonKey);
    }
    // Configurar de nuevo es la unica vez en que se vuelve a preguntar por el
    // RPC: si la URL cambio, es otro proyecto y puede tener el DDL aplicado.
    rpcAusente = null;
    // Y por el mismo motivo se olvida lo sembrado: los ids que ya estaban en la base
    // eran de OTRO proyecto. Con la URL nueva hay que volver a preguntar (RULE-SUP-076).
    eventosSembrados = false;
    siembraEnCurso = null;
    return configActual();
  }

  function configActual() {
    return { url: config.url, anonKey: config.anonKey };
  }

  function isConfigured() {
    return Boolean(
      config.url && config.anonKey &&
      String(config.url).indexOf("__PP_") !== 0 && String(config.anonKey).indexOf("__PP_") !== 0
    );
  }

  // ---------------------------------------------------------------------------
  // Red
  // ---------------------------------------------------------------------------

  /** Lo que no se reintenta y por que esta en el comentario de la cabecera. */
  function noReintentar(status) {
    if (status === 401 || status === 403 || status === 404) return true;
    return false;
  }

  const dormir = (ms) => new Promise((r) => root.setTimeout(r, ms));

  function recorte(valor, maximo) {
    const salida = String(valor == null ? "" : valor).trim();
    const tope = maximo || 300;
    return salida.length > tope ? salida.slice(0, tope) + "..." : salida;
  }

  /**
   * Unico lugar por donde sale un texto ajeno al informe. Quita el token y la
   * clave si por lo que sea vinieran dentro: la garantia es que el informe NO
   * puede contenerlos, no que hoy no contenga ninguno.
   */
  function sano(valor, secretos) {
    let salida = recorte(valor, 300);
    (secretos || []).forEach((secreto) => {
      if (!secreto) return;
      salida = salida.split(String(secreto)).join("[oculto]");
    });
    return salida;
  }

  function cabeceras(token, prefer) {
    const base = {
      // La clave publicable identifica el proyecto ante el gateway (es lo que
      // documenta Supabase y lo que ya hace supabase-reader.js).
      apikey: config.anonKey,
      // Y el rol sale de aqui: el JWT de la sesion. Nunca la clave sola.
      Authorization: "Bearer " + token,
      "Content-Type": "application/json",
    };
    return prefer ? Object.assign(base, { Prefer: prefer }) : base;
  }

  function construirUrl(tabla, opciones) {
    const opts = opciones || {};
    const partes = [];
    if (opts.onConflict) partes.push("on_conflict=" + encodeURIComponent(opts.onConflict));
    if (opts.columna) partes.push(encodeURIComponent(opts.columna) + "=" + opts.valor);
    if (opts.condicion) partes.push(opts.condicion);
    return config.url + "/rest/v1/" + encodeURIComponent(tabla) + (partes.length ? "?" + partes.join("&") : "");
  }

  /**
   * El reloj de UN intento, en milisegundos, a partir del TAMANO del cuerpo. El piso
   * (`TIMEOUT_POR_INTENTO_MS`) es el de siempre; lo que cambia es que un cuerpo grande ya
   * no se corta a los 30 s. Se calcula con `cuerpo.length` (unidades UTF-16) y no con el
   * byte exacto: en un JSON de plan casi todo es ASCII, y el piso de subida (10 KB/s,
   * contra los ~21-26 KB/s medidos) deja margen de sobra para los acentos.
   */
  function timeoutDeCuerpo(cuerpo) {
    const bytes = cuerpo ? cuerpo.length : 0;
    const bruto = Math.ceil(bytes / SUBIDA_MINIMA_BYTES_POR_SEGUNDO) * 1000;
    return Math.max(TIMEOUT_POR_INTENTO_MS, Math.min(TIMEOUT_MAXIMO_POR_INTENTO_MS, bruto));
  }

  /**
   * Cuantos intentos merece un cuerpo: un cuerpo chico reintenta lo transitorio tres
   * veces, uno grande va una sola vez (ver UMBRAL_CUERPO_GRANDE_BYTES).
   */
  function intentosDeCuerpo(cuerpo) {
    const bytes = cuerpo ? cuerpo.length : 0;
    return bytes > UMBRAL_CUERPO_GRANDE_BYTES ? 1 : INTENTOS;
  }

  /**
   * Una escritura a la Data API, con reintentos. Devuelve la respuesta si la
   * llamada salio; lanza con un mensaje que dice el status y el detalle de
   * PostgREST (que es donde esta la causa: columna que no existe, RLS, etc.).
   *
   * `opciones.destino` existe para el RPC: la ruta /rpc/plan_guardar lleva una
   * barra que construirUrl() escaparia, y meterla en un parametro en vez de
   * parchear el constructor mantiene las dos formas de escribir con el MISMO
   * reintento, el mismo timeout y la misma regla de no reintentar.
   *
   * El reloj y los intentos dependen del TAMANO del cuerpo (timeoutDeCuerpo e
   * intentosDeCuerpo): MEDIDO 2026-10-10, con un reloj fijo de 30 s un cuerpo de
   * 2-4 MB no terminaba de subir por el enlace del usuario (~21-26 KB/s).
   */
  async function pedir(token, metodo, tabla, opciones) {
    const opts = opciones || {};
    const destino = opts.destino || construirUrl(tabla, opts);
    const cuerpo = opts.cuerpo === undefined ? undefined : JSON.stringify(opts.cuerpo);
    const cabecerasPeticion = cabeceras(token, opts.prefer);
    const esperaMs = timeoutDeCuerpo(cuerpo);
    const intentos = intentosDeCuerpo(cuerpo);
    let ultimo = null;
    for (let intento = 0; intento < intentos; intento += 1) {
      if (intento > 0) await dormir(ESPERAS_MS[intento - 1] || ESPERAS_MS[ESPERAS_MS.length - 1]);
      const control = new AbortController();
      const temporizador = root.setTimeout(() => control.abort(new Error(
        "se agoto el tiempo de subida (" + Math.round(esperaMs / 1000) + " s) para " +
        (cuerpo ? cuerpo.length : 0) + " caracteres; el enlace tardo mas que su piso de subida"
      )), esperaMs);
      try {
        const respuesta = await root.fetch(destino, {
          method: metodo,
          headers: cabecerasPeticion,
          body: cuerpo,
          signal: control.signal,
          cache: "no-store",
        });
        if (respuesta.ok) return respuesta;
        let detalle = "";
        try { detalle = await respuesta.text(); } catch { detalle = ""; }
        ultimo = new Error("HTTP " + respuesta.status + (detalle ? ": " + detalle : ""));
        ultimo.status = respuesta.status;
        if (noReintentar(respuesta.status)) throw ultimo;
      } catch (error) {
        // Si es el que acabamos de armar con un status que no se reintenta, sale
        // aqui mismo y no vuelve al for.
        if (error === ultimo) throw ultimo;
        ultimo = error;
      } finally {
        root.clearTimeout(temporizador);
      }
    }
    throw ultimo || new Error("HTTP ? sin respuesta");
  }

  // ---------------------------------------------------------------------------
  // Las tres formas de escribir
  // ---------------------------------------------------------------------------

  /**
   * Espejo: borra las filas y reinserta las del estado. SIN transaccion: son dos
   * peticiones y no hay rollback (esta en la cabecera, y no se disimula).
   *
   * `borrar` es un parametro y NO un supuesto, porque en las tres tablas del ERP
   * el borrado es un riesgo de perder datos: ver el PELIGRO MEDIDO de la cabecera.
   * Ahi `escribirEspejo` se llama con borrar:false y el POST queda siendo un
   * UPSERT por clave natural, que actualiza lo que la persona toco y no toca lo
   * que el navegador no conoce.
   */
  async function escribirEspejo(ctx, tabla, filas, vaciar, borrar) {
    if (!filas.length && !vaciar) {
      // MEDIDO 2026-09-30 en produccion: esto NO es un error. Es el freno del vacio
      // funcionando: la tabla se deja intacta a proposito. Pero `cerrar()` contaba
      // cualquier `error` como ok=false, y el toast decia "No se pudo guardar el plan"
      // cuando el plan SI se guardo. Ahora es una nota, no un error.
      return { insertadas: 0, error: null, nota: "sin filas: no se borra la tabla (vaciarSiEstaVacio lo hace explicito)" };
    }
    try {
      if (borrar) await pedir(ctx.token, "DELETE", tabla, { condicion: "id=neq." + UUID_NULO });
      if (!filas.length) return { insertadas: filas.length, error: null, borradas: borrar ? 0 : 0 };
      await pedir(ctx.token, "POST", tabla, {
        cuerpo: filas,
        onConflict: CLAVE_NATURAL[tabla],
        prefer: "resolution=merge-duplicates,return=minimal",
      });
      return { insertadas: filas.length, error: null };
    } catch (error) {
      return { insertadas: 0, error: sano((error && error.message) || error, ctx.secretos) };
    }
  }

  /**
   * Anexo: se sube o se pisa por su clave natural y NUNCA se borra. Lo usan los
   * snapshots, que son historial de planes publicados (RULE-OT-005).
   */
  async function escribirAnexo(ctx, tabla, filas, onConflict) {
    if (!filas.length) return { insertadas: 0, error: null };
    try {
      await pedir(ctx.token, "POST", tabla, {
        cuerpo: filas,
        onConflict: onConflict,
        prefer: "resolution=merge-duplicates,return=minimal",
      });
      return { insertadas: filas.length, error: null };
    } catch (error) {
      const crudo = sano((error && error.message) || error, ctx.secretos);
      // MEDIDO 2026-09-30 en produccion, 4 catalogos con HTTP 400 y este texto:
      //   there is no unique or exclusion constraint matching the ON CONFLICT specification
      // O sea: el on_conflict que mandamos no lo puede inferir la base. Las dos causas
      // posibles, y las dos se arreglan con DDL, no con codigo: el indice no existe, o es
      // un indice UNICO PARCIAL (PostgreSQL solo infiere indices sin predicado, y PostgREST
      // no manda el predicado). Sin este texto, quien lo lee tiene que saber de Postgres
      // para saber que hacer; con el, sabe que tiene que aplicar el DDL.
      const sinRestriccion = /no unique or exclusion constraint matching the ON CONFLICT/i.test(crudo);
      if (sinRestriccion) {
        return {
          insertadas: 0,
          error: crudo,
          nota: `a ${tabla} le falta un indice unico COMPLETO sobre (${onConflict}), o el que hay es parcial. `
            + "Es un cambio de schema, no de la pagina: aplica docs/schema-supabase-cierre-catalogos.sql",
        };
      }
      return { insertadas: 0, error: crudo };
    }
  }

  // ---------------------------------------------------------------------------
  // CATALOGOS: lo que edita la persona en la pestana Catalogos
  // ---------------------------------------------------------------------------
  //
  // QUE ES Y QUE NO ES. Estas nueve tablas NO son un espejo del estado: son
  // CATALOGOS, y el estado es la vista que de ellas tiene la pagina. Por eso aqui NO
  // se borra la tabla entera y se reescribe (el modelo de las seis de plan_guardar):
  // se hace UPSERT por clave natural de lo que hay en el estado (anexo), y el borrado
  // comparativo esta APAGADO desde 2026-09-30 (ver BORRADO APAGADO, abajo). La razon
  // esta medida: OCHO de las nueve (todas menos machine_catalog) las escribe TAMBIEN
  // el espejo de las Hojas (16-supabase-catalogo.js, borra-e-inserta desde las Hojas
  // congeladas), o sea que hay un segundo escritor (riesgo documentado en Project
  // Memory, decision del usuario 2026-10-03) y un borrado masivo desde un navegador
  // con estado viejo se llevaria filas que la persona todavia no ha visto. Es el mismo
  // peligro medido de la cabecera para operations/work_orders/materials, aqui con un
  // escritor menos visible.
  //
  // POR QUE EL BORRADO NECESITA `clavesLeidas` Y NO PUEDE HACERSE SOLO. Para saber
  // que fila hay que borrar hay que compararla con lo que se leyo AL ARRANCAR. Sin
  // ese dato, "lo que no esta en el estado" incluye todo lo que la pagina todavia no
  // conoce, y borrarlo seria perder filas. Por eso quien llama (supabase-catalog-
  // apply.js) pasa `clavesLeidas`, que es lo que el lector vio, y sin ese argumento
  // NO se borra nada: solo se sube lo que hay. Quitar sin guardar el estado previo es
  // una operacion que no se puede hacer bien, y se dice con un aviso en vez de
  // adivinar.
  //
  // LO QUE NO SE ESCRIBE, Y POR QUE. MEDIDO 2026-10-03: operators y matrix YA se
  // escriben desde aqui (arriba en CATALOGOS, con el mapeo inverso de mapOperators /
  // mapMatrixFull de supabase-reader.js), asi que la pestana Matriz se guarda. Lo que
  // sigue SIN escritora desde la pagina son capabilities y operation_catalog (y
  // ot_types, que es de la hoja): su forma en el estado es indexada y con reglas
  // derivadas (operationRules, capacityModes, cts), y mapearlas enteras al reves sin
  // medir cada columna seria inventar el contrato. Se declara como no escrito y la
  // pagina lo avisa, en vez de fingir que se guardo.
  //
  // MEDIDO 2026-09-29: con la sesion, RLS DEJA ESCRIBIR estas tablas. La sonda
  // .openchamber/sonda-rls-escritura.mjs manda un DELETE con un filtro que no puede
  // matchear nada y solo pregunta por el permiso: HTTP 204 en las 11 tablas de
  // catalogo y en las del plan, o sea que hay politica de escritura para
  // `authenticated`. Por eso la escritura desde el navegador es posible y no hace
  // falta el puente para ningun catalogo.

  /**
   * Las nueve tablas, su clave natural y el mapeo desde el estado. El mapeo es el
   * INVERSO EXACTO de mapTools, mapSubcontracts, mapCalendar, mapOtConfigurations,
   * mapArticleConfigurations, mapOperators, mapMatrixFull y mapMachines en
   * supabase-reader.js: si uno de los dos lados cambia un nombre, el otro tiene que
   * cambiarlo en la misma TASK, porque un guardado y su lectura tienen que cerrar.
   */
  const CATALOGOS = [
    {
      tabla: "tools",
      clave: "codigo",
      // De donde sale el item para registrar un borrado a proposito (registrarBorrado).
      // Solo lo traen las tablas con puerta de borrado en la pantalla.
      campoEstado: "toolCatalog",
      mapear: function (state) {
        return (Array.isArray(state.toolCatalog) ? state.toolCatalog : []).map(function (item) {
          return {
            codigo: texto(item.id),
            parte: texto(item.part),
            herramental: texto(item.herramental),
            kit: texto(item.kitHerramental),
            tiempo_ajuste_herr: Math.round(numero(item.toolSetupMinutes, 0)),
            tiempo_ajuste_kit: Math.round(numero(item.kitSetupMinutes, 0)),
            activo: booleano(item.active, true),
          };
        }).filter(function (fila) { return Boolean(fila.codigo); });
      },
    },
    {
      tabla: "subcontracts",
      clave: "codigo",
      campoEstado: "subcontracts",
      mapear: function (state) {
        return (Array.isArray(state.subcontracts) ? state.subcontracts : []).map(function (item) {
          return {
            codigo: texto(item.id),
            parte: texto(item.part || "*") || "*",
            tipo: texto(item.name),
            dias_habiles: Math.round(numero(item.days, 3)) || 3,
            activo: booleano(item.active, true),
          };
        }).filter(function (fila) { return Boolean(fila.codigo) && Boolean(fila.tipo); });
      },
    },
    {
      tabla: "calendar_exceptions",
      // MEDIDO 2026-09-30 contra la base real, con un INSERT de prueba dentro de un
      // begin/rollback (no se escribio nada):
      //   on_conflict (fecha_inicio, concepto, maquina) -> ERROR 42P01
      //   on_conflict (fecha,        concepto, maquina) -> ok
      // El indice que YA existe es calendar_exceptions_fecha_concepto_maquina_key, sobre
      // (fecha, concepto, maquina). O sea que el problema nunca fue que faltara el indice,
      // que es lo que suponia el DDL de este repo: es que la clave que mandaba aqui era la
      // columna equivocada. `fecha` es NOT NULL y el espejo la pone igual a `fecha_inicio`,
      // asi que los dos valores coinciden fila por fila y el indice sobre `fecha` deduplica
      // exactamente lo mismo.
      //
      // Se corrige el ESCRITOR y no la base, al reves de lo que se penso. Agregar un indice
      // sobre (fecha_inicio, concepto, maquina) habria dejado DOS indices unicos para lo
      // mismo, y el segundo se llenaria de NULL, que en PostgreSQL no se consideran iguales
      // entre si (NULL != NULL), o sea que no habria deduplicado nada.
      clave: "fecha,concepto,maquina",
      campoEstado: "calendarExceptions",
      mapear: function (state) {
        return (Array.isArray(state.calendarExceptions) ? state.calendarExceptions : []).map(function (item) {
          const inicio = texto(item.startDate);
          const fin = texto(item.endDate) || inicio;
          return {
            // `fecha` es NOT NULL y parte del unique (fecha, concepto, maquina): se
            // iguala al inicio de la ventana, que es lo que hace el espejo.
            fecha: inicio || fin || "1970-01-01",
            fecha_inicio: inicio || null,
            hora_inicio: texto(item.start),
            fecha_fin: fin || null,
            hora_fin: texto(item.end),
            concepto: texto(item.concepto || item.concept) || "GENERAL",
            maquina: texto(item.machine),
            motivo: texto(item.reason),
            activo: booleano(item.active, true),
          };
        }).filter(function (fila) { return Boolean(fila.fecha_inicio); });
      },
    },
    {
      tabla: "ot_configurations",
      clave: "ot",
      mapear: function (state) {
        const out = [];
        Object.keys(state.otConfigurations && typeof state.otConfigurations === "object" ? state.otConfigurations : {}).forEach(function (k) {
          const item = state.otConfigurations[k];
          if (!item || typeof item !== "object") return;
          const ot = texto(item.ot || k);
          if (!ot) return;
          const fila = {
            ot: ot,
            maquina: texto(item.machine),
            kit: texto(item.kitHerramental),
            kit_pendiente: booleano(item.kitPending, false),
            tipo_subcontrato: texto(item.subcontractType),
            dias_subcontrato: Math.round(numero(item.subcontractDays, 0)),
            herramental: texto(item.herramental),
            // jsonb: SIEMPRE arreglo, nunca cadena. Una columna jsonb con texto que no
            // es JSON revienta el INSERT de la tabla entera (ver jsonb()).
            herramentales_extra: listaDeHerramentales(item.additionalHerramentales),
            // RULE-OT-057: la captura comercial POR OT (RULE-OT-056) tiene columna propia.
            // Antes vivia solo en memoria/cache local y se perdia en cada guardado; por eso
            // "Generar plan" volvia a pedir los detalles de OT. Se normaliza igual que
            // article_configurations (jobType->tipo_ot, planningType->tipo_trabajo).
            tipo_ot: texto(item.jobType).toUpperCase(),
            tipo_trabajo: texto(item.planningType).toUpperCase(),
            precio_manual: numero(item.manualUnitPrice, 0),
            comercial_capturado_en: instante(texto(item.commercialCapturedAt), ""),
            actualizado: instante(texto(item.updatedAt) || new Date().toISOString()),
          };
          // RESIDUO DERIVADO, NO SE PERSISTE (medido 2026-10-06: 243 skeleton en la base).
          // Una fila sin contenido real (sin maquina/kit/herramental/subcontrato) y SIN
          // marca de actualizado es una config que normalizeOtResourceAssignments derivo de
          // una OT que nunca tuvo fila ni edicion: persistirla solo acumula filas en
          // ot_configurations (medido 2026-10-06: 154 -> 249 en un dia) y engorda el aviso
          // de "leidas que aqui NO estan". La marca distingue el caso legitimo: editar
          // SIEMPRE sella updatedAt (app.js escribe new Date().toISOString()), asi que una
          // config que la persona VACIO a proposito tiene marca y se escribe con sus vacios
          // (borrando lo viejo). Solo aplica a ot_configurations: es la unica tabla de
          // catalogos que la pagina re-deriva de operations.
          const esResiduo = !fila.maquina && !fila.kit && !fila.herramental &&
            fila.herramentales_extra.length === 0 && !fila.kit_pendiente &&
            !fila.tipo_subcontrato && fila.dias_subcontrato <= 0 &&
            !fila.tipo_ot && !fila.tipo_trabajo && fila.precio_manual <= 0 &&
            !fila.comercial_capturado_en &&
            !texto(item.updatedAt);
          if (esResiduo) return;
          out.push(fila);
        });
        return out;
      },
    },
    {
      tabla: "article_configurations",
      clave: "articulo",
      mapear: function (state) {
        const out = [];
        Object.keys(state.articleConfigurations && typeof state.articleConfigurations === "object" ? state.articleConfigurations : {}).forEach(function (k) {
          const item = state.articleConfigurations[k];
          if (!item || typeof item !== "object") return;
          const articulo = texto(item.article || k).toUpperCase();
          if (!articulo) return;
          out.push({
            articulo: articulo,
            tipo_ot: texto(item.jobType).toUpperCase(),
            tipo_trabajo: texto(item.planningType).toUpperCase(),
            precio_manual: numero(item.manualUnitPrice, 0),
            // precio_ref_venta NO se escribe: lo baja el sync con el precio de venta de
            // NetSuite (RULE-REP-021) y es distinto del PRECIO_MANUAL que escribe una
            // persona. Mandarlo seria pisar el dato del ERP con el de la pagina.
            actualizado: instante(texto(item.updatedAt) || new Date().toISOString()),
          });
        });
        return out;
      },
    },
    {
      tabla: "operators",
      // MEDIDO 2026-09-30 contra la base: clave unica nombre, 18 filas, con politica de
      // escritura para authenticated. La base estaba preparada; faltaba el escritor.
      clave: "nombre",
      campoEstado: "operators",
      mapear: function (state) {
        const nombres = Array.isArray(state.operators) ? state.operators : [];
        const capacidad = state.operatorCapacity || {};
        const rendimiento = state.operatorPerformance || {};
        const perfiles = state.operatorProfiles || {};
        return nombres.map(function (nombre) {
          const n = texto(nombre);
          if (!n) return null;
          const perfil = perfiles[n] || {};
          return {
            nombre: n,
            // nombre_real es el NOMBRE de la persona; el lector cae al OPERADOR cuando esta
            // vacio, asi que se devuelve igual para no perder el nombre real.
            nombre_real: texto(perfil.name) || n,
            categoria: texto(perfil.category),
            // activo: el estado trae SOLO los activos, asi que la lista ES la lista de
            // activos. Un operador que se quito de la matriz ya no esta en state.operators,
            // y su fila SE BORRA solo si el handler registro la intencion con
            // registrarBorrado (removeOperator / renameOperator): quien solo deja de verla
            // sin pasar por el handler no recibe ningun DELETE.
            activo: true,
            minutos_capacidad: Math.round(numero(capacidad[n], 2400)),
            rendimiento_pct: Math.round(numero(rendimiento[n], 100)),
          };
        }).filter(Boolean);
      },
    },
    {
      tabla: "matrix",
      // MEDIDO 2026-09-30 contra la base: clave unica (capability_key, operator), 97 filas.
      //
      // DOS FUENTES, Y POR QUE HACE FALTAN LAS DOS. El UNIVERSO (QUE parejas existen) sale
      // de state.matrixFull, la rejilla COMPLETA que trae el lector al arrancar: un no no
      // se puede expresar como una AUSENCIA, porque matrix NO tiene puerta de borrado
      // (registrarBorrado no le declara campoEstado): una pareja ausente del estado nunca
      // recibe DELETE y la fila vieja se quedaria marcada para siempre. El VALOR (marcada
      // o no) sale de state.matrix, que es lo que edita la persona (toggleMatrix,
      // removeCapability, removeOperator, renameOperator) y lo que la pantalla ensena.
      //
      // MEDIDO 2026-10-06, el bug que separo las dos fuentes: el valor se congelaba en la
      // rejilla leida al arrancar (los editores tocan state.matrix y NUNCA matrixFull), y
      // como applyImported ni siquiera mapeaba imported.matrixFull, la rejilla llegaba
      // vacia: 0 filas subidas y las 97 leidas salian como "que el navegador ya no tiene".
      // state.matrix no sirve como universo (no trae las DESMARCADAS) ni la rejilla como
      // valor (no trae las MARCADAS nuevas: nace en el arranque y nadie la actualiza).
      clave: "capability_key,operator",
      mapear: function (state) {
        const rejilla = Array.isArray(state.matrixFull) ? state.matrixFull : [];
        // Sin state.matrix no hay con que decidir el valor: se conserva el comportamiento
        // viejo (la rejilla con su propio habilitado) en vez de mandar todo en false, que
        // seria desmarcar la matriz entera sin que nadie lo pidiera.
        const marcadas = state.matrix && typeof state.matrix === "object" ? state.matrix : null;
        const vistos = new Set();
        const filas = [];
        // Una pareja repetida se manda una vez. Sin esto, dos filas con la misma clave en el
        // mismo POST darian 23505 y se perderia el guardado entero de la matriz.
        function meter(key, operador, habilitado) {
          if (!key || !operador) return;
          const id = key + "|" + operador;
          if (vistos.has(id)) return;
          vistos.add(id);
          filas.push({
            capability_key: key,
            operator: operador,
            habilitado: Boolean(habilitado),
          });
        }
        rejilla.forEach(function (celda) {
          const key = texto(celda && celda.capabilityKey);
          const operador = texto(celda && celda.operator);
          if (!key || !operador) return;
          if (!marcadas) {
            meter(key, operador, Boolean(celda && celda.habilitado));
            return;
          }
          const lista = marcadas[key];
          const marcada = Array.isArray(lista)
            && lista.some(function (nombre) { return texto(nombre) === operador; });
          meter(key, operador, marcada);
        });
        // Las parejas marcadas que el universo NO conoce: una casilla recien marcada, o una
        // rejilla que no se pudo leer. Sin esto la marca nueva nunca se subiria.
        if (marcadas) {
          Object.keys(marcadas).forEach(function (key) {
            const lista = marcadas[key];
            if (!Array.isArray(lista)) return;
            const k = texto(key);
            if (!k) return;
            lista.forEach(function (operador) { meter(k, texto(operador), true); });
          });
        }
        return filas;
      },
    },
    {
      tabla: "machine_planning_overrides",
      clave: "machine_nombre",
      campoEstado: "machines",
      // Una fila por maquina APARTADA, y solo esas: la tabla registra la decision de
      // no agendar en una maquina (RULE-SUP-017). `machine_catalog` NO se escribe
      // desde aqui: la pagina es la unica escritora del catalogo (guardarCatalogos).
      mapear: function (state) {
        const out = [];
        (Array.isArray(state.machines) ? state.machines : []).forEach(function (item) {
          const nombre = texto(item.id);
          if (!nombre) return;
          if (item.excluded !== true) return;
          out.push({ machine_nombre: nombre.toUpperCase(), excluida: true, actualizado: instante(new Date().toISOString()) });
        });
        return out;
      },
    },
    {
      // MEDIDO 2026-10-01, DECISION DEL USUARIO: el catalogo de maquinas es un dato
      // MANUAL. La pagina es la UNICA escritora de `machine_catalog` (guardarCatalogos),
      // y la ingesta ya no lo escribe. Ver docs/schema-machine-catalog.sql.
      //
      // El mapeo es el INVERSO de mapMachines: state.machines sale de machine_catalog
      // (supabase-reader.js), y aqui se devuelve cada maquina con su nombre y su
      // bandera activa. Las apartadas (excluded) se apartan en
      // machine_planning_overrides, no aqui: una cosa es el listado y otra es la
      // decision de no agendar.
      tabla: "machine_catalog",
      clave: "nombre",
      campoEstado: "machines",
      mapear: function (state) {
        return (Array.isArray(state.machines) ? state.machines : []).map(function (item) {
          return {
            nombre: texto(item.id),
            activa: booleano(item.active, true),
          };
        }).filter(function (fila) { return Boolean(fila.nombre); });
      },
    },
  ];

  /** HERRAMENTALES_EXTRA_JSON: el estado trae un arreglo y la columna es jsonb. */
  function listaDeHerramentales(valor) {
    if (Array.isArray(valor)) {
      const out = [];
      const vistos = {};
      valor.forEach(function (item) {
        const t = texto(item);
        if (!t || vistos[t]) return;
        vistos[t] = true;
        out.push(t);
      });
      return out;
    }
    return jsonb(valor, []);
  }

  /**
   * El filtro de un DELETE por clave natural COMPUESTA, en el `and=(...)` que
   * PostgREST entiende. Sin comillas porque los tres valores de la clave de
   * calendar_exceptions son fecha, concepto y maquina: texto sin espacios ni
   * comas, que es justo lo que se valida antes de armar el filtro.
   */
  function condicionDeClave(def, clave) {
    // MEDIDO 2026-09-30 en produccion: esta funcion usaba el VALOR de la clave como nombre de
    // COLUMNA. Con una clave como 1905 generaba un filtro del tipo columna-igual-a-1905 usando
    // 1905 en los dos lados, y Postgres contestaba 42703 diciendo que no existia una columna con
    // ese numero. El DELETE de lo que la persona quito no habia funcionado para NINGUNA tabla
    // salvo calendar_exceptions, que tenia un caso especial escrito a mano. Nadie lo noto
    // porque el informe mezclaba el error del POST con el del DELETE en un solo campo.
    //
    // Ahora el nombre de la columna sale de def.clave partido por comas, y el valor sale de la
    // clave partido por el separador. No queda ningun nombre de columna escrito a mano, que es
    // lo que dejo pasar el bug: al cambiar la clave de un catalogo, un caso especial con el
    // nombre viejo queda colgando sin que nada lo avise.
    const columnas = String((def && def.clave) || "").split(",").map((c) => c.trim()).filter(Boolean);
    if (!columnas.length) return null;
    const valores = String(clave == null ? "" : clave).split("|");
    if (valores.length !== columnas.length) return null;
    if (columnas.length === 1) return columnas[0] + "=eq." + encodeURIComponent(valores[0]);
    return "and=(" + columnas.map((c, i) => c + ".eq." + encodeURIComponent(valores[i])).join(",") + ")";
  }

  /** La clave de la fila, tal como se guarda en las claves que se leyeron al arrancar. */
  function claveDeFila(def, fila) {
    // MEDIDO 2026-09-30: esta funcion comparaba contra la clave VIEJA de calendar_exceptions,
    // la de fecha_inicio. Al cambiarla por la de fecha (que es la del indice real de la base,
    // MEDIDO con un INSERT de prueba) el caso especial dejo de aplicar, la tabla cayo a leer
    // una propiedad llamada con la clave entera, que es undefined: sus claves salian vacias y
    // sus DELETES salian como clave natural ilegible.
    //
    // Ahora sale de def.clave partido por comas, igual que condicionDeClave.
    const columnas = String((def && def.clave) || "").split(",").map((c) => c.trim()).filter(Boolean);
    if (!columnas.length) return "";
    if (columnas.length === 1) return texto(fila[columnas[0]]);
    const partes = columnas.map((c) => texto(fila[c]));
    // Una clave compuesta con alguna parte vacia NO es una clave: es una fila que el
    // navegador no ha terminado de llenar. Se devuelve cadena vacia para que la fila no
    // entre en las claves y por lo tanto no se pueda borrar por una condicion a medias, que
    // seria peor que no borrarla.
    if (partes.some((p) => p === "")) return "";
    return partes.join("|");
  }

  /**
   * Lo que la pagina va a escribir. Devuelve tambien las claves: las nuevas y las
   * que ya estaban, que es lo que permite distinguir "agrego" de "quito".
   */
  /**
   * Que escribe la pagina en cada tabla del ERP, y por que no se borra. MEDIDO 2026-09-30:
   * esto era un solo texto para las tres, y para materials no era cierto.
   *
   * operations: la pagina decide cuando, donde, con que y en que orden. Si una operacion se
   *   quita del plan, su fila NO se borra, porque la ingesta de NetSuite es la segunda
   *   escritora y el borrado se llevaria tambien las que la persona todavia no ha visto.
   * work_orders: la pagina escribe las fechas y el precio. Articulo, cantidad y cliente son
   *   del ERP.
   * materials: la pagina NO decide que materiales tiene una OT. Escribe una sola columna,
   *   emitido, que es si el material salio. Las filas las pone la ingesta.
   */
  /**
   * Que se escribio en cada tabla del ERP, en UNA FRASE. MEDIDO 2026-09-30.
   *
   *   materials: la pagina solo marca que material se emitio. NO decide cuales son: la lista
   *     la pone la ingesta de NetSuite, que es la segunda escritora. Por eso no se borra
   *     nada: un borrado se llevaria los materiales que la ingesta metio despues de esta
   *     carga, que son mas nuevos que lo que el navegador sabe.
   *   work_orders: la pagina escribe las fechas y el precio de una orden. Articulo, cantidad
   *     y cliente son del ERP.
   *   operations: la pagina decide cuando, donde, con que y en que orden. Si una operacion
   *     se quita del plan, su fila NO se borra: el valor viejo se queda, que es lo unico
   *     seguro mientras haya dos escritores.
   *
   * POR QUE UNA FRASE Y NO UN PARRAFO. Un toast dice QUE PASO; el porque se queda aqui. El
   * texto largo de la primera version salia cortado a media palabra, y el de materials
   * ademas describia algo que no pasaba (decia de operaciones del plan en una tabla donde la
   * pagina no decide componentes). Un aviso que no cabe no se lee, y uno que describe mal
   * hace sospechar de algo que no esta pasando.
   */
  function queSeEscribioDe(tabla) {
    if (tabla === "materials") return "materials: solo se marco que material se emitio; la lista es de NetSuite";
    if (tabla === "work_orders") return "work_orders: se actualizaron solo fechas y precio; el resto es de NetSuite";
    return "operations: no se borro nada; la ingesta de NetSuite tambien escribe aqui";
  }

  function armarCatalogos(state) {
    const out = {};
    CATALOGOS.forEach(function (def) {
      let filas = [];
      try { filas = def.mapear(state) || []; } catch (error) { filas = []; }
      const claves = {};
      filas.forEach(function (fila) {
        const clave = claveDeFila(def, fila);
        if (clave) claves[clave] = true;
      });
      out[def.tabla] = { definicion: def, filas: filas, claves: claves };
    });
    return out;
  }

  /**
   * REGISTRA LA INTENCION de borrar UNA fila de catalogo y devuelve su clave natural
   * (o null si no hay nada que borrar). Es la UNICA puerta de entrada del borrado
   * (RULE-SUP-061): guardarCatalogos solo borra claves que esten aqui registradas.
   *
   * POR QUE POR INTENCION Y NO POR DIFERENCIA. MEDIDO 2026-09-30: comparar las claves
   * leidas al arrancar contra las que hay ahora borro 76 filas de ot_configurations,
   * porque las DOS salen del mismo estado y aqui no se puede distinguir "la persona la
   * quito" de "el navegador simplemente no la tiene". La diferencia sigue calculandose
   * en guardarCatalogos, pero solo para un aviso que NO toca la red.
   *
   * COMO DERIVA LA CLAVE. Aisla el item dentro de una copia del estado y pasa por el
   * MISMO mapeo y la MISMA claveDeFila que la subida: la clave que se registra es, por
   * construccion, la misma que tiene escrita la fila. Si el mapeo no produce fila (una
   * maquina no apartada no tiene fila en machine_planning_overrides) o la clave sale
   * vacia, no se registra nada: no hay nada que borrar.
   *
   * SOLO con campoEstado declarado. ot_configurations y article_configurations son
   * objetos (no listas) y matrix se edita con banderas: esas tres no tienen puerta de
   * borrado en la pantalla, y aqui no se les inventa una.
   *
   * Devuelve la clave registrada, o null. Registra una sola vez la misma clave.
   */
  function registrarBorrado(state, tabla, item) {
    const datos = state && typeof state === "object" ? state : {};
    let def = null;
    CATALOGOS.forEach(function (c) { if (c.tabla === tabla) def = c; });
    if (!def || !def.campoEstado) return null;
    const original = datos[def.campoEstado];
    if (!Array.isArray(original)) return null;
    const semilla = {};
    semilla[def.campoEstado] = [item];
    const aislado = Object.assign({}, datos, semilla);
    let filas = [];
    try { filas = def.mapear(aislado) || []; } catch (error) { filas = []; }
    if (!filas.length) return null;
    const clave = claveDeFila(def, filas[0]);
    if (!clave) return null;
    if (!datos.__borradosPendientes || typeof datos.__borradosPendientes !== "object") {
      datos.__borradosPendientes = {};
    }
    const lista = Array.isArray(datos.__borradosPendientes[tabla])
      ? datos.__borradosPendientes[tabla]
      : [];
    if (lista.indexOf(clave) === -1) lista.push(clave);
    datos.__borradosPendientes[tabla] = lista;
    return clave;
  }

  /**
   * ESCRIBE LOS CATALOGOS. Devuelve el informe con la misma forma que el del plan
   * (ok, tablas, avisos, ms) para que quien llama no tenga dos caminos distintos
   * para leer un resultado.
   *
   * `opciones.clavesLeidas` es lo que el lector vio al arrancar: { tabla: [claves] }.
   * Sirve SOLO para el aviso de "leidas que aqui NO estan; NO se tocan": el borrado
   * no depende de ella, sino de state.__borradosPendientes (registrarBorrado).
   */
  async function guardarCatalogos(state, opciones) {
    const opts = opciones || {};
    const t0 = Date.now();
    const informe = { ok: true, tablas: {}, ms: 0, avisos: [], camino: "catalogos" };
    const datos = state && typeof state === "object" ? state : {};

    if (!isConfigured()) {
      return sinEscribir(informe, t0, "Supabase no esta configurado en este build: faltan la URL o la clave publicable");
    }
    const auth = root.PPSupabaseAuth;
    if (!auth || typeof auth.token !== "function") {
      return sinEscribir(informe, t0, "no esta PPSupabaseAuth: no hay quien pida el token de sesion");
    }
    const token = await auth.token();
    if (!token) {
      return sinEscribir(informe, t0, "no hay sesion de Supabase: entra con tu correo para poder guardar los catalogos. No se escribe nada");
    }
    const ctx = { token: token, secretos: [token, config.anonKey].filter(Boolean), t0: t0, avisos: [] };

    const armado = armarCatalogos(datos);
    for (const tabla of Object.keys(armado)) {
      const parte = armado[tabla];
      const def = parte.definicion;
      // Subir lo que hay. Anexo, no espejo: nunca borra (ver el bloque de arriba).
      informe.tablas[tabla] = await escribirAnexo(ctx, tabla, parte.filas, def.clave);

      // ---------------------------------------------------------------------------
      // BORRADO A PROPOSITO, POR INTENCION (RULE-SUP-061). El unico DELETE que sale
      // de aqui es el de una clave registrada en state.__borradosPendientes[tabla] por
      // el handler que quito la fila (registrarBorrado), y solo en la sesion que la
      // quito. Sin intencion registrada no se borra NADA, por mucho que difieran las
      // claves leidas al arrancar y las que hay ahora.
      //
      // POR QUE NO POR DIFERENCIA (el modelo viejo, medido 2026-09-30): comparar lo
      // leido contra lo que hay borro 76 filas de ot_configurations, porque las dos
      // listas salen del MISMO estado y aqui no se puede distinguir "la persona la
      // quito" de "el navegador simplemente no la tiene". La diferencia se calcula mas
      // abajo, pero solo para un aviso que no toca la red.
      //
      // UNA FILA QUE VOLVIO NO SE BORRA: si la clave esta en parte.claves (se quito y
      // se volvio a agregar antes de guardar), la intencion queda anulada.
      //
      // SI EL DELETE FALLA, LA CLAVE QUEDA PENDIENTE: sale de __borradosPendientes solo
      // cuando se resolvio (borrada, anulada, o ilegible ya para siempre). El fallo
      // deja la intencion viva para el proximo guardado y pone el error en el informe
      // con su paso, para que el toast diga que fallo el BORRADO y no la subida.
      const pendientes = datos.__borradosPendientes && typeof datos.__borradosPendientes === "object"
        && Array.isArray(datos.__borradosPendientes[tabla])
        ? datos.__borradosPendientes[tabla]
        : [];
      let borradas = 0;
      let errorBorrado = null;
      const resueltas = [];
      for (const clave of pendientes) {
        if (parte.claves[clave]) { resueltas.push(clave); continue; }
        // Una condicion por fila, y cada una con su propia peticion: un `or=(...)` con
        // claves compuestas se pone ilegible rapido, y borrar de mas es el fallo caro.
        const cond = condicionDeClave(def, clave);
        if (!cond) {
          // Una clave ilegible no se vuelve legible con el tiempo: si quedara pendiente,
          // reintentaria para siempre un filtro que nunca se puede armar.
          errorBorrado = "clave natural ilegible: " + recorte(clave, 60);
          resueltas.push(clave);
          continue;
        }
        try {
          await pedir(ctx.token, "DELETE", tabla, { condicion: cond });
          borradas += 1;
          resueltas.push(clave);
        } catch (e) {
          errorBorrado = sano((e && e.message) || e, ctx.secretos);
          // Sin resueltas: esta clave y las que siguen quedan pendientes para el
          // proximo guardado.
          break;
        }
      }
      if (pendientes.length) {
        const restantes = pendientes.filter(function (clave) { return resueltas.indexOf(clave) === -1; });
        if (restantes.length) datos.__borradosPendientes[tabla] = restantes;
        else delete datos.__borradosPendientes[tabla];
        const previo = informe.tablas[tabla];
        // MEDIDO 2026-09-30: esto era un solo campo, `error: error || previo.error`, que
        // mezclaba el fallo del POST con el del DELETE. Con un 42P01 del POST tapado, el 42703
        // del DELETE no se veia. Dos escrituras, un campo: el toast senalaba al sistema
        // equivocado. Ahora los dos van por separado y el de arriba sigue siendo el primero que
        // fallo, para que el toast no cambie de lo que ya se acostumbro la gente.
        informe.tablas[tabla] = {
          insertadas: previo.insertadas,
          borradas: borradas,
          error: errorBorrado || previo.error || null,
          errorPost: previo.error || null,
          errorDelete: errorBorrado || null,
          paso: errorBorrado ? "borrado de lo que quitaste" : (previo.error ? "subida de lo que hay" : null),
        };
        if (borradas && !errorBorrado) {
          informe.avisos.push(tabla + ": " + borradas + " fila(s) borrada(s) A PROPOSITO de la base");
        }
      }

      // LO QUE LA PAGINA NO TIENE, DICHO Y NO TOCADO. Las claves leidas al arrancar que
      // no estan en lo que la pagina mapea ahora pueden ser filas que la persona quito
      // (ya salieron arriba, con su intencion) o filas que el navegador simplemente no
      // tiene (ot_configurations las pierde normalizeOtResourceAssignments; desde
      // 2026-10-06 el mapear tampoco PERSISTE ese residuo: una config derivada sin marca
      // de edicion es un skeleton sin contenido y no se escribe, asi la tabla deja de
      // crecer por eso). Aqui NO se borra ninguna: sin intencion registrada la
      // diferencia es solo un aviso, y el aviso lo dice.
      const leidas = opts.clavesLeidas && opts.clavesLeidas[tabla];
      if (Array.isArray(leidas)) {
        const fuera = leidas.filter(function (clave) {
          return !parte.claves[clave] && pendientes.indexOf(clave) === -1;
        });
        if (fuera.length) {
          informe.avisos.push(
            tabla + ": " + fuera.length + " fila(s) leidas que aqui NO estan; NO se tocan"
          );
        }
      }
    }

    // Lo que NO se escribe, dicho. La pagina lo muestra: un "guardado" que se
    // tragase la mitad de lo que se toco es peor que uno que avisa.
    if (opts.ambito === "matrix") {
      informe.avisos.push(
        // MEDIDO 2026-09-30: esto eran ~470 caracteres y el toast tiene max-width: 360px con
        // font-size: 11px: salia cortado por abajo y sin final. Es el MISMO fallo que el de los
        // avisos del ERP, y lo cometi dos veces porque no habia un candado que lo midiera. Hay
        // un test que mide el largo de los avisos del escritor.
        //
        // EL CORTO DICE QUE SE GUARDARON DOS Y QUE NO SE GUARDAN OTRAS DOS. El por que de
        // cada una esta arriba, en los comments de los catalogos.
        //
        // MEDIDO 2026-10-01, CORRECCION DE UN MOTIVO QUE ESTABA MAL. Este texto decia que
        // "a capabilities le faltan dos columnas a la pagina (ct y operacion, y el lector no
        // las trae por capacidad, asi que escribirla las mandaria vacias en 76 filas)". Es
        // FALSO: mapCapabilities (supabase-reader.js) SI lee las dos columnas de la tabla.
        // El motivo real es otro y es mas grave: PP_buildState_ (02-storage.js:480-493), que
        // es el CONTRATO del estado, no guarda el CT por capacidad. Solo lo mete en una lista
        // plana `state.cts` (sin decir a que clave pertenece) y guarda OPERACION como `label`
        // DENTRO de customCapabilities, y solo cuando custom es true. O sea que la
        // associacion clave -> ct se DESTRUYE al leer: despues de un viaje de ida y vuelta no
        // hay forma de saber que CT le tocaba a cada capacidad, ni aunque el lector trajera la
        // columna. Escribirla exigiria 76 filas a las que se les pondria un CT equivocado, que
        // es peor que no escribirla: el plan asignaria maquinas por una capacidad ajena.
        // Para cerrarlo habria que cambiar el CONTRATO del estado (guardar ct y operacion por
        // clave) y todos los que lo consumen, no solo el escritor.
        //
        // Y operation_catalog es el listado de operaciones DE NETSUITE: si la pagina lo
        // escribiera, pisaria el ERP con lo local.
        "Matriz: se guardaron operators y matrix. NO capabilities ni operation_catalog (de NetSuite)."
      );
    }
    return cerrar(informe, t0);
  }

  // ---------------------------------------------------------------------------
  // EL TRAMO DE INSPECCION: UNA fila, un solo escritor
  // ---------------------------------------------------------------------------
  //
  // QUE ES Y POR QUE NO ESTA EN `CATALOGOS`. `inspection_routes` es el catalogo de
  // tramos de inspeccion, migrado de la hoja `Tramos` del libro
  // INSPECTION_SPREADSHEET_ID (docs/schema-inspection-routes.sql). MEDIDO
  // 2026-10-01: antes de migrar, la pagina lo leia de `materials` (que es tabla DEL
  // ERP) y por ahi no hay columna de tramo, y lo guardaba tambien en `materials`
  // (`dibujo: route`), o sea que un tramo de inspeccion terminaba en una columna de
  // dibujo de materiales que el RESTlet 2246 sobreescribe cada 15 minutos. No era
  // un problema de sincronizacion: el dato no estaba donde se guardaba.
  //
  // POR QUE UNA FUNCION SUELTA Y NO UNA ENTRADA DE CATALOGOS. Los catalogos se
  // guardan con guardarCatalogos(state), que es un ESPEJO del estado del plan
  // entero, y `inspection_routes` no es parte de ese estado (PP_buildState_ no tiene
  // un campo de tramos). Meterlo en CATALOGOS obligaria a meter los tramos en el
  // estado, y eso es cambiar un contrato que consume el planificador entero para
  // algo que solo usa la pestana de inspeccion. Ademas el guardado de un tramo es
  // de UNA fila: la persona edita un tramo y le da Guardar. Un espejo por cada
  // guardado de tramo no cabe.
  //
  // EL ESCRITOR. Esta funcion. Y solo esta. Antes de migrar habia dos escritores
  // peleando por el mismo dato (esta pagina y `saveInspectionLink` de Apps Script,
  // que escribia la hoja) y el que perdia se enteraba al imprimir, no al guardar.
  // `saveInspectionLink` de Apps Script ahora se niega con un mensaje que dice
  // donde esta (16-inspection-service.js).
  //
  // QUE DEVUELVE. `{ ok, fila, avisos, ms }` con `fila` YAGUARDADO (la fila que
  // quedo en la base, no la que se pidio): quien llama la pinta en la tabla
  // despues de guardar, y si se pinta la que se pidio y el servidor normalizo
  // algo, la tabla y la base se separan hasta la recarga.
  //
  // LO QUE NO HACE, A PROPOSITO. No borra. No hay accion de "borrar tramo" en la
  // pagina y anadirla seria meter un DELETE desde un navegador contra una tabla que
  // se puede reponer con una importacion, sin la garantia de que se estea
  // borrando lo que la persona cree. Para dejar de usar un tramo se le borra el
  // texto, que es lo que se puede deshacer.
